<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="365" fill="#fafbfc"/><path d="M110 75 V355 M790 75 V355" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Xuất kho</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="117" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị công việc xuất kho được giao gồm xuất nguyên vật liệu để sản xuất hoặc xuất thành</tspan><tspan x="92" dy="19">phẩm để giao hàng. (CongViec, PhanCongCongViec, PhanCongKho, PhieuYeuCauNhapXuat) Mỗi công</tspan><tspan x="92" dy="19">việc giữ đúng lô, vị trí và lượng Quản lý kho đã phân công; thứ tự điều phối ưu tiên hạn dùng</tspan><tspan x="92" dy="19">sớm, cùng hạn dùng thì nhập kho trước xuất trước. Nhân viên không tự phân công lại.</tspan><tspan x="92" dy="19">(PhanCongKho, LoHang, ChiTietLo, ViTriKho, PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 311 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>