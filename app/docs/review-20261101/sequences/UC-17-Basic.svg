<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="673" fill="#fafbfc"/><path d="M110 75 V663 M790 75 V663" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Phê duyệt đề xuất xử lý ngoại lệ (BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị danh sách đề xuất đang chờ phê duyệt (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 235 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">3. Chọn một đề xuất để xem chi tiết (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 312 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="336" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="359" font-size="14"><tspan x="92" dy="0">4. Hiển thị thông tin chi tiết đề xuất, loại hàng, số lượng, hàng bị vấn đề gì</tspan><tspan x="92" dy="19">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, PhieuKiemKe, ChiTietPhieuKiemKe, KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo, MatHang, NguyenVatLieu, ThanhPham, LoaiHang)</tspan></text><path d="M790 427 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="451" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="474" font-size="14"><tspan x="92" dy="0">5. Chọn Phê duyệt (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 504 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="528" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="551" font-size="14"><tspan x="92" dy="0">6. Lưu quyết định phê duyệt và thông báo cho Quản lý kho. Việc phê duyệt không tự thay đổi số</tspan><tspan x="92" dy="19">lượng tồn kho; Quản lý kho thực hiện phương án được chấp thuận ở bước xử lý riêng.</tspan><tspan x="92" dy="19">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M790 619 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>