<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1173" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="1173" fill="#fafbfc"/><path d="M110 75 V1163 M790 75 V1163" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1.1 Tìm kiếm hoặc lọc kết quả theo những điều kiện được hiển thị trên màn hình</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Nhân viên nhập điều kiện tìm kiếm hoặc lọc kết quả. (KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 254 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">2. Hệ thống hiển thị kết quả phù hợp (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">2.1 Chọn Thêm</tspan></text><path d="M110 485 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="509" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="532" font-size="14"><tspan x="92" dy="0">1. Hệ thống thực hiện UC-12.1</tspan></text><path d="M110 562 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="586" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="609" font-size="14"><tspan x="92" dy="0">4.1 Chọn Sửa </tspan></text><path d="M110 639 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="663" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="686" font-size="14"><tspan x="92" dy="0">1. Hệ thống thực hiện UC-12.2</tspan></text><path d="M110 716 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="740" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="763" font-size="14"><tspan x="92" dy="0">4.2 Xem kết quả đã ghi nhận</tspan></text><path d="M110 793 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="817" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="840" font-size="14"><tspan x="92" dy="0">1. Kết quả đã ghi không được xóa; nếu sai, thực hiện điều chỉnh tại UC-12.2 để giữ lịch sử.</tspan><tspan x="92" dy="19">UC-12.3 không còn được sử dụng để xóa kết quả. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 889 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="913" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="936" font-size="14"><tspan x="92" dy="0">4.3 Kết quả ghi nhận &quot;không đạt&quot;</tspan></text><path d="M110 966 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="990" width="744" height="117" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1013" font-size="14"><tspan x="92" dy="0">1. Hệ thống lưu kết quả không đạt và ghi nhận trạng thái để tiếp tục xử lý hàng lỗi</tspan><tspan x="92" dy="19">(KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC) Chứng từ còn cần xử lý được làm nổi bật và hiển</tspan><tspan x="92" dy="19">thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không kết</tspan><tspan x="92" dy="19">thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp lệ.</tspan><tspan x="92" dy="19">(ThongBao, CongViec)</tspan></text><path d="M110 1119 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>