<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="673" fill="#fafbfc"/><path d="M110 75 V663 M790 75 V663" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Khách hàng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Đặt đơn hàng (DonHang)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị danh sách hàng mẫu để lựa chọn (MatHang, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 235 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">3. Chọn một hoặc nhiều mặt hàng, nhập số lượng theo đơn vị hiển thị, ghi chú từng dòng nếu có;</tspan><tspan x="92" dy="19">nhập địa chỉ, ngày nhận trễ nhất và ghi chú chung. (MatHang, ThanhPham, DonViTinh)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">4. Xác nhận đặt hàng</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">5. Kiểm tra hàng còn được đặt, các mặt hàng không trùng, số lượng dương, địa chỉ và ngày nhận;</tspan><tspan x="92" dy="19">lấy giá hiện hành của mặt hàng để tính tiền tham khảo. (MatHang, ThanhPham, KhachHang)</tspan></text><path d="M790 504 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="528" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="551" font-size="14"><tspan x="92" dy="0">6. Lưu một đơn hàng với các dòng đã chọn, trạng thái Chờ tiếp nhận; thông báo đặt thành công</tspan><tspan x="92" dy="19">và gửi thông báo cho Bộ phận lập kế hoạch. Đặt hàng chưa tạo lô hàng vật lý. (DonHang,</tspan><tspan x="92" dy="19">ChiTietDonHang, KhachHang, ThongBao)</tspan></text><path d="M790 619 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>