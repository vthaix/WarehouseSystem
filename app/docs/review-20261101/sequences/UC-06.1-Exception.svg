<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1192" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="1192" fill="#fafbfc"/><path d="M110 75 V1182 M790 75 V1182" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">4.1 Tên danh mục đã tồn tại</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo tên danh mục đã tồn tại và yêu cầu nhập lại (LoaiHang)</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 2</tspan></text><path d="M110 312 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="336" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="359" font-size="14"><tspan x="92" dy="0">4.2 Dữ liệu nhập bị bỏ trống</tspan></text><path d="M110 389 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="413" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="436" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo vui lòng nhập đầy đủ thông tin (LoaiHang)</tspan></text><path d="M110 466 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="490" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="513" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 2</tspan></text><path d="M110 543 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="567" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="590" font-size="14"><tspan x="92" dy="0">4.3 Nhóm danh mục không hợp lệ</tspan></text><path d="M110 620 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="644" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="667" font-size="14"><tspan x="92" dy="0">1. Hệ thống yêu cầu chọn nhóm Nguyên vật liệu hoặc Thành phẩm.</tspan></text><path d="M110 697 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="721" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="744" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 2</tspan></text><path d="M110 774 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="798" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="821" font-size="14"><tspan x="92" dy="0">4.4 Ảnh không hợp lệ</tspan></text><path d="M110 851 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="875" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="898" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo ảnh không được chấp nhận và yêu cầu chọn lại ảnh.</tspan></text><path d="M110 928 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="952" width="744" height="174" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="975" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 23.2 Nếu phiên đăng nhập hết hạn hoặc người dùng không có quyền thao tác1. Hệ</tspan><tspan x="92" dy="19">thống yêu cầu đăng nhập lại hoặc thông báo không có quyền. (NguoiDung, NguoiDungVaiTro,</tspan><tspan x="92" dy="19">VaiTro, PhienDangNhap)2. Không thực hiện thay đổi chưa được cho phép.3.3 Nếu dữ liệu vừa bị</tspan><tspan x="92" dy="19">người khác thay đổi hoặc không còn tồn tại1. Hệ thống thông báo và không lưu đè thông tin cũ.</tspan><tspan x="92" dy="19">(LoaiHang)2. Người dùng tải lại danh sách hoặc chi tiết trước khi thực hiện lại.3.4 Nếu không</tspan><tspan x="92" dy="19">kết nối được khi xác nhận1. Hệ thống thông báo thao tác chưa có kết quả xác định.2. Khi kết</tspan><tspan x="92" dy="19">nối trở lại, người dùng kiểm tra danh sách hoặc chi tiết để biết lần trước đã được ghi nhận</tspan><tspan x="92" dy="19">chưa rồi mới thử lại; không mặc định bấm lại là tạo chứng từ mới.</tspan></text><path d="M110 1138 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>