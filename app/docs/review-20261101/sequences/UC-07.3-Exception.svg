<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1018" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="1018" fill="#fafbfc"/><path d="M110 75 V1008 M790 75 V1008" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">4.1 Tên bị trùng</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo tên đã tồn tại và yêu cầu nhập lại (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 3</tspan></text><path d="M110 312 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="336" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="359" font-size="14"><tspan x="92" dy="0">4.2 Nếu dữ liệu bị nhập sai định dạng</tspan></text><path d="M110 389 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="413" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="436" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo lỗi định dạng và yêu cầu nhập lại (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 466 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="490" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="513" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 3</tspan></text><path d="M110 543 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="567" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="590" font-size="14"><tspan x="92" dy="0">4.3 Dữ liệu để trống</tspan></text><path d="M110 620 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="644" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="667" font-size="14"><tspan x="92" dy="0">1. Hệ thống thông báo vui lòng nhập đầy đủ thông tin (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 697 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="721" width="744" height="231" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="744" font-size="14"><tspan x="92" dy="0">2. Quay lại bước 34.4 Thay đổi thông tin có ảnh hưởng đến dữ liệu đã sử dụng1. Hệ thống kiểm</tspan><tspan x="92" dy="19">tra các chứng từ liên quan. (MatHang, NguyenVatLieu, ThanhPham)2. Nếu thông tin không được</tspan><tspan x="92" dy="19">phép thay đổi, hệ thống thông báo và giữ nguyên thông tin cũ.3.2 Nếu phiên đăng nhập hết hạn</tspan><tspan x="92" dy="19">hoặc người dùng không có quyền thao tác1. Hệ thống yêu cầu đăng nhập lại hoặc thông báo không</tspan><tspan x="92" dy="19">có quyền. (NguoiDung, NguoiDungVaiTro, VaiTro, PhienDangNhap)2. Không thực hiện thay đổi chưa</tspan><tspan x="92" dy="19">được cho phép.3.3 Nếu dữ liệu vừa bị người khác thay đổi hoặc không còn tồn tại1. Hệ thống</tspan><tspan x="92" dy="19">thông báo và không lưu đè thông tin cũ. (MatHang, NguyenVatLieu, ThanhPham)2. Người dùng tải</tspan><tspan x="92" dy="19">lại danh sách hoặc chi tiết trước khi thực hiện lại.3.4 Nếu không kết nối được khi xác nhận1.</tspan><tspan x="92" dy="19">Hệ thống thông báo thao tác chưa có kết quả xác định.2. Khi kết nối trở lại, người dùng kiểm</tspan><tspan x="92" dy="19">tra danh sách hoặc chi tiết để biết lần trước đã được ghi nhận chưa rồi mới thử lại; không mặc</tspan><tspan x="92" dy="19">định bấm lại là tạo chứng từ mới.</tspan></text><path d="M110 964 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>