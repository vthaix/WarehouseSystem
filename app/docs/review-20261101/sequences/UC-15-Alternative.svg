<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="519" fill="#fafbfc"/><path d="M110 75 V509 M790 75 V509" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Ban kiểm kê</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">3.1 Điền nhanh số lượng đạt</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Nhân viên chọn Đạt ở dòng cần điền hoặc Đạt tất cả. (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Hệ thống điền lượng đối chiếu cho dòng chưa ghi nhận; không ghi đè các dòng đã có kết quả</tspan><tspan x="92" dy="19">hoàn tất. (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">3. Nhân viên kiểm tra và điều chỉnh số thực đếm, sau đó tiếp tục bước 5. (PhieuKiemKe,</tspan><tspan x="92" dy="19">ChiTietPhieuKiemKe) Chứng từ còn cần xử lý được làm nổi bật và hiển thị số lượng chờ trên chức</tspan><tspan x="92" dy="19">năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không kết thúc phần việc; dấu chỉ hết</tspan><tspan x="92" dy="19">khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp lệ. (ThongBao, CongViec)</tspan></text><path d="M110 465 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>