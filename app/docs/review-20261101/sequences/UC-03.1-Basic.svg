<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="712" fill="#fafbfc"/><path d="M110 75 V702 M790 75 V702" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Khách hàng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn Sửa đơn hàng (DonHang)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị form với thông tin hiện tại của đơn hàng (DonHang, ChiTietDonHang, MatHang,</tspan><tspan x="92" dy="19">ThanhPham)</tspan></text><path d="M790 254 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">3. Nhập thông tin muốn chỉnh sửa (số lượng, mô tả) (DonHang, ChiTietDonHang)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">4. Chọn xác nhận (DonHang, ChiTietDonHang)</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">5. Kiểm tra thông tin mới (DonHang, ChiTietDonHang, KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M790 485 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="509" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="532" font-size="14"><tspan x="92" dy="0">6. Cập nhật thông tin đơn hàng hợp lệ, giữ trạng thái xử lý hiện tại. (DonHang,</tspan><tspan x="92" dy="19">ChiTietDonHang)</tspan></text><path d="M790 581 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="605" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="628" font-size="14"><tspan x="92" dy="0">7. Thông báo cập nhật đơn hàng thành công.</tspan></text><path d="M790 658 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>