<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="768" fill="#fafbfc"/><path d="M110 75 V758 M790 75 V758" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho, Chủ xưởng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Tra cứu dữ liệu (Kho, ViTriKho, TonKho, LoHang, ChiTietLo, MatHang,</tspan><tspan x="92" dy="19">NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 177 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="201" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="224" font-size="14"><tspan x="92" dy="0">2. Hiển thị xưởng, kho và sơ đồ vị trí. Mỗi xưởng có kho nguyên vật liệu, kho thành phẩm và</tspan><tspan x="92" dy="19">kho hàng trả về; danh sách kho đổi theo xưởng được chọn. (Xuong, Kho, ViTriKho)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Chọn xưởng, một trong ba kho, khu lưu trữ; có thể lọc nhóm hàng, danh mục hoặc tìm theo tên</tspan><tspan x="92" dy="19">mặt hàng, mã mặt hàng, mã lô. (Xuong, Kho, ViTriKho, LoaiHang, MatHang, NguyenVatLieu,</tspan><tspan x="92" dy="19">ThanhPham, LoHang, ChiTietLo)</tspan></text><path d="M110 388 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="412" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="435" font-size="14"><tspan x="92" dy="0">4. Hiển thị các khu có tên theo nhóm hàng, như Khu bột, Khu đường muối, Khu bao bì; phân biệt</tspan><tspan x="92" dy="19">vị trí có hàng, trống và đang chọn. Có thể xem một khu hoặc tất cả khu. (Kho, ViTriKho,</tspan><tspan x="92" dy="19">LoaiHang, MatHang, LoHang, ChiTietLo, TonKho)</tspan></text><path d="M790 503 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="527" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="550" font-size="14"><tspan x="92" dy="0">5. Chọn vị trí để xem chi tiết hàng đang lưu. (Kho, ViTriKho, TonKho, ChiTietLo)</tspan></text><path d="M110 580 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="604" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="627" font-size="14"><tspan x="92" dy="0">6. Hiển thị thông tin chi tiết (Kho, ViTriKho, MatHang, NguyenVatLieu, ThanhPham, DonViTinh,</tspan><tspan x="92" dy="19">LoHang, ChiTietLo, TonKho, PhanCongKho) Tra cứu chỉ đọc dữ liệu; gợi ý vị trí khi nhập và thứ</tspan><tspan x="92" dy="19">tự lô khi xuất được thực hiện tại UC-08 và UC-09, không tự chuyển hàng khi xem sơ đồ. (Kho,</tspan><tspan x="92" dy="19">ViTriKho, TonKho, PhanCongKho)</tspan></text><path d="M790 714 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>