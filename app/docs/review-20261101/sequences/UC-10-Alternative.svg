<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="519" fill="#fafbfc"/><path d="M110 75 V509 M790 75 V509" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">3.1 Chỉ nhập một phần số lượng được phân công</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Nhân viên kho điều chỉnh lượng thực nhập trong giới hạn còn được nhập và ghi chú thực tế</tspan><tspan x="92" dy="19">nếu cần.</tspan></text><path d="M110 254 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">2. Hệ thống ghi nhận đúng lượng thực nhập; lượng còn lại chưa được coi là đã nhập.</tspan><tspan x="92" dy="19">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho)</tspan></text><path d="M110 350 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="374" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="397" font-size="14"><tspan x="92" dy="0">3. Tiếp tục bước 5; phần còn lại thực hiện bằng lần ghi nhận sau khi còn đủ điều kiện. Nếu vị</tspan><tspan x="92" dy="19">trí thực tế cần thay đổi, liên hệ Quản lý kho điều chỉnh phần chưa thực hiện trước khi ghi</tspan><tspan x="92" dy="19">phiếu; không tự chuyển vị trí bằng thao tác nhập. (PhanCongKho, ViTriKho)</tspan></text><path d="M110 465 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>