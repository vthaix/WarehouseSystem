<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 903" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="903" fill="#fafbfc"/><path d="M110 75 V893 M790 75 V893" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận mua hàng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Mua hàng</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị hai hình thức Lập trực tiếp và Theo kế hoạch mua nguyên vật liệu.</tspan></text><path d="M790 235 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">3. Chọn Theo kế hoạch mua nguyên vật liệu và chọn kế hoạch đã được duyệt. (KeHoachMuaBan)</tspan></text><path d="M110 312 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="336" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="359" font-size="14"><tspan x="92" dy="0">4. Hiển thị danh sách nguyên vật liệu, số lượng và ngày nhận mong muốn của kế hoạch; hiển thị</tspan><tspan x="92" dy="19">báo cáo nguồn nếu kế hoạch có báo cáo. (KeHoachMuaBan, ChiTietKeHoachMuaBan, MatHang,</tspan><tspan x="92" dy="19">NguyenVatLieu, DonViTinh, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 427 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="451" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="474" font-size="14"><tspan x="92" dy="0">5. Chọn nhà cung cấp cho từng nguyên vật liệu; kiểm tra đơn vị, nhập giá thỏa thuận, điều kiện</tspan><tspan x="92" dy="19">giao hàng và ghi chú. (MatHang, NguyenVatLieu, NhaCungCap, DonViTinh)</tspan></text><path d="M110 523 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="547" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="570" font-size="14"><tspan x="92" dy="0">6. Kiểm tra mặt hàng, nhà cung cấp từng dòng, lượng mua, đơn giá, ngày nhận và kế hoạch nguồn.</tspan><tspan x="92" dy="19">Ngày nhận của đơn theo kế hoạch được lấy từ kế hoạch mua. (KeHoachMuaBan,</tspan><tspan x="92" dy="19">ChiTietKeHoachMuaBan, MatHang, NguyenVatLieu, NhaCungCap, DonViTinh, DonMuaHang,</tspan><tspan x="92" dy="19">ChiTietDonMuaHang)</tspan></text><path d="M790 657 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="681" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="704" font-size="14"><tspan x="92" dy="0">7. Xác nhận mua hàng</tspan></text><path d="M110 734 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="758" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="781" font-size="14"><tspan x="92" dy="0">8. Tạo đơn mua và các dòng nguyên vật liệu, nhà cung cấp tương ứng; ghi nhận kế hoạch và báo</tspan><tspan x="92" dy="19">cáo nguồn nếu có; thông báo mua hàng thành công. Chưa tạo hàng thực nhận hoặc tăng tồn kho.</tspan><tspan x="92" dy="19">(DonMuaHang, ChiTietDonMuaHang, KeHoachMuaBan, BanBaoCaoSanXuat)</tspan></text><path d="M790 849 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>