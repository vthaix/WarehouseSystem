<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 827" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="827" fill="#fafbfc"/><path d="M110 75 V817 M790 75 V817" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">3.1 Tìm kiếm/lọc kế hoạch</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Nhân viên nhập điều kiện tìm kiếm (loại kế hoạch, thời gian, trạng thái)</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Hệ thống hiển thị các kế hoạch phù hợp (KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="92" dy="19">KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">4.1 Chọn Sửa</tspan></text><path d="M110 485 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="509" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="532" font-size="14"><tspan x="92" dy="0">1. Hệ thống thực hiện UC-05.1</tspan></text><path d="M110 562 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="586" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="609" font-size="14"><tspan x="92" dy="0">4.2 Chọn Xóa</tspan></text><path d="M110 639 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="663" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="686" font-size="14"><tspan x="92" dy="0">1. Hệ thống thực hiện UC-05.2 Chứng từ còn cần xử lý được làm nổi bật và hiển thị số lượng chờ</tspan><tspan x="92" dy="19">trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không kết thúc phần việc;</tspan><tspan x="92" dy="19">dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp lệ. (ThongBao,</tspan><tspan x="92" dy="19">CongViec)</tspan></text><path d="M110 773 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>