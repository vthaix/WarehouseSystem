<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="576" fill="#fafbfc"/><path d="M110 75 V566 M790 75 V566" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn Thêm kết quả kiểm tra (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị các đợt được phân công và từng phần lô còn chờ kiểm tra; gợi ý lượng cần kiểm.</tspan><tspan x="92" dy="19">(LoLichKiemTra, PhanCongLichKiemTra, CongViec, PhanCongCongViec, LoHang, ChiTietLo,</tspan><tspan x="92" dy="19">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Nhập lượng kiểm tra, lượng đạt, lượng lỗi và ghi chú của từng dòng lô; xác nhận.</tspan><tspan x="92" dy="19">(ChiTietKetQuaKiemTraQCAC, ChiTietLo)</tspan></text><path d="M110 369 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="393" width="744" height="117" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="416" font-size="14"><tspan x="92" dy="0">4. Kiểm tra lượng đạt cộng lượng lỗi bằng toàn bộ lượng phải kiểm của từng dòng; lưu kết quả</tspan><tspan x="92" dy="19">và cập nhật tiến độ đợt. Nguyên vật liệu lỗi được ghi nhận trả nhà cung cấp theo kết luận;</tspan><tspan x="92" dy="19">phần đạt chưa tăng tồn, phải có yêu cầu và phiếu nhập. Thành phẩm lỗi được xử lý theo kết luận</tspan><tspan x="92" dy="19">và ngoại lệ nếu cần. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo,</tspan><tspan x="92" dy="19">LoLichKiemTra, CongViec, PhanCongLichKiemTra, ChiTietLoTraVe, DonMuaHang)</tspan></text><path d="M790 522 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>