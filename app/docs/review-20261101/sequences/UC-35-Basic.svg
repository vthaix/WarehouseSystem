<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="806" fill="#fafbfc"/><path d="M110 75 V796 M790 75 V796" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Báo cáo thành phẩm (MatHang, ThanhPham)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị kế hoạch, xưởng, số lượng thành phẩm theo kế hoạch, đã báo cáo, còn lại và nguyên</tspan><tspan x="92" dy="19">vật liệu đã xuất cho sản xuất. (KeHoachSanXuat, ChiTietKeHoachSanXuat, Xuong,</tspan><tspan x="92" dy="19">BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, PhieuKho, ChiTietPhieuKho, MatHang, ThanhPham,</tspan><tspan x="92" dy="19">NguyenVatLieu)</tspan></text><path d="M790 292 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="316" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="339" font-size="14"><tspan x="92" dy="0">3. Nhập lượng thành phẩm mới hoàn thành của phần này, thông tin phần lô, ngày sản xuất, hạn</tspan><tspan x="92" dy="19">dùng nếu có và ghi chú. Khi báo cáo đợt cuối, kiểm tra và nhập lượng nguyên vật liệu thực tế</tspan><tspan x="92" dy="19">đã dùng. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat, LoHang, ChiTietLo)</tspan></text><path d="M110 407 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="431" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="454" font-size="14"><tspan x="92" dy="0">4. Cập nhật lượng còn lại theo lượng đang nhập; kiểm tra tổng các phần thành phẩm, lô, ngày và</tspan><tspan x="92" dy="19">lượng nguyên vật liệu sử dụng. Các phần của cùng kế hoạch dùng chung mã lô sản xuất nhưng có</tspan><tspan x="92" dy="19">thông tin phần riêng. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat, LoHang,</tspan><tspan x="92" dy="19">ChiTietLo, KeHoachSanXuat, ChiTietKeHoachSanXuat, PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 541 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="565" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="588" font-size="14"><tspan x="92" dy="0">5. Xác nhận gửi báo cáo</tspan></text><path d="M110 618 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="642" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="665" font-size="14"><tspan x="92" dy="0">6. Lưu và gửi báo cáo thành phẩm; ghi nhận phần lô tương ứng, thông báo cho người nhận. Chỉ</tspan><tspan x="92" dy="19">đợt cuối đủ điều kiện mới hoàn tất kế hoạch; không tự nhập tồn hoặc tự kết luận chất lượng.</tspan><tspan x="92" dy="19">(BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat, LoHang, ChiTietLo,</tspan><tspan x="92" dy="19">KeHoachSanXuat, ThongBao)</tspan></text><path d="M790 752 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>