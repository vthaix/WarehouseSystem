<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="538" fill="#fafbfc"/><path d="M110 75 V528 M790 75 V528" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Quản lý xuất kho</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị yêu cầu xuất nguyên vật liệu hoặc thành phẩm trong phạm vi phụ trách và phần Phiếu</tspan><tspan x="92" dy="19">đã ghi sổ. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho, PhieuKho)</tspan></text><path d="M790 254 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">3. Chọn yêu cầu xuất để xem nguồn, lượng còn phải thực hiện và phân công; hoặc chọn phiếu đã</tspan><tspan x="92" dy="19">ghi sổ để đối chiếu. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhieuKho)</tspan></text><path d="M110 350 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="374" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="397" font-size="14"><tspan x="92" dy="0">4. Hiển thị nguồn yêu cầu, xưởng, kho, ngày giờ, mặt hàng, phần lô và lượng còn được xuất;</tspan><tspan x="92" dy="19">hoặc hiển thị thông tin phiếu đã ghi sổ. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat,</tspan><tspan x="92" dy="19">Xuong, PhanCongKho, PhieuKho, ChiTietPhieuKho, MatHang, NguyenVatLieu, ThanhPham, LoHang,</tspan><tspan x="92" dy="19">ChiTietLo, Kho, ViTriKho, TonKho)</tspan></text><path d="M790 484 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>