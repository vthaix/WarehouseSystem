<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 884" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="884" fill="#fafbfc"/><path d="M110 75 V874 M790 75 V874" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">5.1 Từ chối kế hoạch và có nhập lý do</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Ban giám đốc chọn Từ chối và nhập lý do</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Hệ thống cập nhật trạng thái kế hoạch bị từ chối và thông báo cho Bộ phận lập kế hoạch</tspan><tspan x="92" dy="19">(ThongBao, KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">3. Kết thúc UC</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">5.2 Từ chối kế hoạch và không nhập lý do</tspan></text><path d="M110 485 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="509" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="532" font-size="14"><tspan x="92" dy="0">1. Ban giám đốc chọn Từ chối và không nhập lý do</tspan></text><path d="M110 562 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="586" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="609" font-size="14"><tspan x="92" dy="0">2. Hệ thống thông báo yêu cầu nhập lý do từ chối</tspan></text><path d="M110 639 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="663" width="744" height="155" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="686" font-size="14"><tspan x="92" dy="0">3. Quay lại bước 45.3 Lượng dự kiến vượt nguồn1. Hệ thống hiển thị cảnh báo phần vượt.</tspan><tspan x="92" dy="19">(KeHoachMuaBan, ChiTietKeHoachMuaBan)2. Ban giám đốc chọn Tiếp tục để duyệt sau khi các điều</tspan><tspan x="92" dy="19">kiện còn lại hợp lệ, hoặc chọn Quay lại để chưa duyệt.3. Xác nhận vượt dự kiến không thay thế</tspan><tspan x="92" dy="19">điều kiện tồn kho và chất lượng khi thực hiện. (TonKho, PhanCongKho) Chứng từ còn cần xử lý</tspan><tspan x="92" dy="19">được làm nổi bật và hiển thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem hoặc</tspan><tspan x="92" dy="19">đọc thông báo không kết thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc</tspan><tspan x="92" dy="19">nguồn không còn hợp lệ. (ThongBao, CongViec)</tspan></text><path d="M110 830 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>