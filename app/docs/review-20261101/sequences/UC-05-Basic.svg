<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="519" fill="#fafbfc"/><path d="M110 75 V509 M790 75 V509" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Quản lý kế hoạch</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị các kế hoạch của chức năng đang chọn cùng trạng thái và nguồn liên quan.</tspan><tspan x="92" dy="19">(KeHoachMuaBan, KeHoachSanXuat)</tspan></text><path d="M790 254 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">3. Chọn một kế hoạch để xem chi tiết (KeHoachMuaBan, KeHoachSanXuat)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">4. Hiển thị kế hoạch và các dòng chi tiết; kế hoạch sản xuất có đơn hàng, xưởng và nguyên vật</tspan><tspan x="92" dy="19">liệu; kế hoạch mua hoặc bán có báo cáo nguồn nếu được lập từ báo cáo. (KeHoachMuaBan,</tspan><tspan x="92" dy="19">ChiTietKeHoachMuaBan, KeHoachSanXuat, ChiTietKeHoachSanXuat, DonHang, ChiTietDonHang, Xuong,</tspan><tspan x="92" dy="19">BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M790 465 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>