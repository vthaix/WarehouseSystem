<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="806" fill="#fafbfc"/><path d="M110 75 V796 M790 75 V796" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Nhập kho</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị công việc nhập kho được giao, yêu cầu nguồn, lô hoặc phần lô và lượng còn được</tspan><tspan x="92" dy="19">thực hiện. (CongViec, PhanCongCongViec, PhanCongKho, PhieuYeuCauNhapXuat,</tspan><tspan x="92" dy="19">ChiTietPhieuYeuCauNhapXuat, LoHang, ChiTietLo)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Chọn công việc, đối chiếu giấy tờ thực nhập với đúng lô và vị trí Quản lý kho đã giao; kiểm</tspan><tspan x="92" dy="19">tra số lượng gợi ý, nhập lượng thực nhập và ghi chú. Không tự đổi sang lô hoặc vị trí ngoài</tspan><tspan x="92" dy="19">phân công. (CongViec, PhanCongCongViec, PhanCongKho, LoHang, ChiTietLo, ViTriKho)</tspan></text><path d="M110 388 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="412" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="435" font-size="14"><tspan x="92" dy="0">4. Kiểm tra đúng người được phân công, kho, vị trí, dòng lô và lượng nhập không vượt lượng</tspan><tspan x="92" dy="19">được giao hoặc phần đạt chất lượng còn chưa nhập. (CongViec, PhanCongCongViec, PhanCongKho,</tspan><tspan x="92" dy="19">Kho, ViTriKho, LoHang, ChiTietLo, KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietPhieuKho)</tspan></text><path d="M790 522 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="546" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="569" font-size="14"><tspan x="92" dy="0">5. Xác nhận nhập kho</tspan></text><path d="M110 599 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="623" width="744" height="117" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="646" font-size="14"><tspan x="92" dy="0">6. Ghi phiếu nhập kho, tăng tồn theo lượng thực nhập, cập nhật lượng đã thực hiện và trạng</tspan><tspan x="92" dy="19">thái công việc; thông báo thành công. Hồ sơ được cung cấp cho người có quyền xem. (PhieuKho,</tspan><tspan x="92" dy="19">ChiTietPhieuKho, TonKho, BienDongKho, PhanCongKho, PhieuYeuCauNhapXuat,</tspan><tspan x="92" dy="19">ChiTietPhieuYeuCauNhapXuat, CongViec) Thời điểm ghi phiếu nhập là căn cứ xét lô nhập trước khi</tspan><tspan x="92" dy="19">các lô có cùng hạn dùng tại kho này. (PhieuKho, ChiTietPhieuKho, Kho)</tspan></text><path d="M790 752 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>