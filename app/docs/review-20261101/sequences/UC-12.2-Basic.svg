<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="538" fill="#fafbfc"/><path d="M110 75 V528 M790 75 V528" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn kết quả cần điều chỉnh và mở Chứng từ bù QC. (ChungTuBuQC, KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 177 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="201" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="224" font-size="14"><tspan x="92" dy="0">2. Hiển thị dòng lô, số lượng đạt, số lượng lỗi và nội dung lỗi hiện tại. (KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC, ChiTietLo)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Nhập số đạt, số lỗi mới, mô tả lỗi nếu có và lý do điều chỉnh; xác nhận. Số nhập là kết quả</tspan><tspan x="92" dy="19">mới, không phải số chênh lệch. (ChungTuBuQC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 369 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="393" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="416" font-size="14"><tspan x="92" dy="0">4. Kiểm tra người lập, dòng lô và tổng lượng không đổi; lưu chứng từ điều chỉnh và kết quả mới</tspan><tspan x="92" dy="19">nếu đủ điều kiện. Không sửa phiếu kho hoặc tự thay đổi tồn kho. (ChungTuBuQC,</tspan><tspan x="92" dy="19">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC, ChiTietLo)</tspan></text><path d="M790 484 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>