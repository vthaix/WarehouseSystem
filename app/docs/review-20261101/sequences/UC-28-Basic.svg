<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="576" fill="#fafbfc"/><path d="M110 75 V566 M790 75 V566" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Ban kiểm kê, bộ phận QC/AC</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Lập biên bản kiểm kê (PhieuKiemKe, LoLichKiemTra)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị công việc và kết quả đã hoàn tất. Đợt có cả QC/AC và Ban kiểm kê tổng hợp cả chất</tspan><tspan x="92" dy="19">lượng và số đếm; đợt chỉ có một nhóm chỉ yêu cầu kết quả của nhóm được giao. (CongViec,</tspan><tspan x="92" dy="19">PhanCongCongViec, LoLichKiemTra, PhanCongLichKiemTra, PhieuKiemKe, ChiTietPhieuKiemKe,</tspan><tspan x="92" dy="19">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 292 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="316" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="339" font-size="14"><tspan x="92" dy="0">3. Người được chỉ định nhập kết luận, nhận xét; chọn Không có ngoại lệ hoặc Nhập mô tả ngoại</tspan><tspan x="92" dy="19">lệ; nếu có ngoại lệ thì nhập nội dung, xem lại và gửi biên bản. (PhieuKiemKe, LoLichKiemTra)</tspan></text><path d="M110 388 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="412" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="435" font-size="14"><tspan x="92" dy="0">4. Kiểm tra người lập và kết quả đợt; lưu biên bản chung, nội dung ngoại lệ nếu có và gửi</tspan><tspan x="92" dy="19">thông báo. Biên bản đã gửi giữ nguyên kết quả được tổng hợp tại thời điểm gửi. (PhieuKiemKe,</tspan><tspan x="92" dy="19">LoLichKiemTra, PhanCongLichKiemTra, PhanCongKetLuanKiemKe, KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC, ChiTietPhieuKiemKe, ThongBao)</tspan></text><path d="M790 522 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>