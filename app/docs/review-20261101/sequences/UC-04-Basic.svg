<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 884" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="884" fill="#fafbfc"/><path d="M110 75 V874 M790 75 V874" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Lập kế hoạch mua/bán (KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị form lập kế hoạch với loại kế hoạch và nguồn phù hợp; đối với kế hoạch mua nguyên</tspan><tspan x="92" dy="19">vật liệu, có hai hình thức Lập trực tiếp và Theo báo cáo sản xuất. (BanBaoCaoSanXuat,</tspan><tspan x="92" dy="19">KeHoachSanXuat, DonHang)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Chọn kế hoạch mua nguyên vật liệu, hình thức Theo báo cáo sản xuất và báo cáo nhu cầu đã</tspan><tspan x="92" dy="19">gửi có nguyên vật liệu còn thiếu. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M110 369 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="393" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="416" font-size="14"><tspan x="92" dy="0">4. Hệ thống lấy danh sách nguyên vật liệu và lượng thiếu; Bộ phận lập kế hoạch kiểm tra lượng</tspan><tspan x="92" dy="19">mua, đơn giá dự kiến, chọn ngày nhận mong muốn và nhập ghi chú. Không chọn nhà cung cấp ở bước</tspan><tspan x="92" dy="19">lập kế hoạch. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang, NguyenVatLieu, DonViTinh)</tspan></text><path d="M110 484 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="508" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="531" font-size="14"><tspan x="92" dy="0">5. Kiểm tra loại báo cáo, số lượng còn thiếu và thông tin kế hoạch. (BanBaoCaoSanXuat,</tspan><tspan x="92" dy="19">ChiTietBaoCaoSanXuat, KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M790 580 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="604" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="627" font-size="14"><tspan x="92" dy="0">6. Tính tổng tiền dựa trên đơn giá * số lượng (ChiTietKeHoachMuaBan)</tspan></text><path d="M790 657 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="681" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="704" font-size="14"><tspan x="92" dy="0">7. Chọn Xác nhận</tspan></text><path d="M110 734 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="758" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="781" font-size="14"><tspan x="92" dy="0">8. Lưu kế hoạch và chi tiết, ghi nhận báo cáo nguồn nếu có, chuyển sang Chờ phê duyệt và thông</tspan><tspan x="92" dy="19">báo thành công. (KeHoachMuaBan, ChiTietKeHoachMuaBan, BanBaoCaoSanXuat, ThongBao)</tspan></text><path d="M790 830 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>