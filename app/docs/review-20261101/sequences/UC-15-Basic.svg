<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="768" fill="#fafbfc"/><path d="M110 75 V758 M790 75 V758" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Ban kiểm kê</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Thực hiện kiểm kê</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị các công việc được giao; khi chọn công việc, hiển thị toàn bộ lô hoặc phần lô phải</tspan><tspan x="92" dy="19">kiểm cùng mặt hàng, đơn vị và lượng hệ thống để đối chiếu. (CongViec, PhanCongCongViec,</tspan><tspan x="92" dy="19">LoLichKiemTra, PhanCongLichKiemTra, LoHang, ChiTietLo, MatHang, DonViTinh, PhieuKiemKe,</tspan><tspan x="92" dy="19">ChiTietPhieuKiemKe, TonKho)</tspan></text><path d="M790 292 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="316" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="339" font-size="14"><tspan x="92" dy="0">3. Chọn công việc và nhập lượng thực đếm của từng dòng; có thể chọn Đạt ở một dòng hoặc Đạt</tspan><tspan x="92" dy="19">tất cả để điền lượng bằng lượng hệ thống. (PhieuKiemKe, ChiTietPhieuKiemKe,</tspan><tspan x="92" dy="19">PhanCongLichKiemTra)</tspan></text><path d="M110 407 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="431" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="454" font-size="14"><tspan x="92" dy="0">4. Hiển thị chênh lệch theo số lượng vừa nhập; vẫn cho sửa lượng đã điền để đúng thực tế. Nút</tspan><tspan x="92" dy="19">Đạt chỉ hỗ trợ kiểm số lượng, không thay kết luận chất lượng của QC/AC. (PhieuKiemKe,</tspan><tspan x="92" dy="19">ChiTietPhieuKiemKe)</tspan></text><path d="M790 522 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="546" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="569" font-size="14"><tspan x="92" dy="0">5. Xác nhận lưu kết quả kiểm số lượng của công việc.</tspan></text><path d="M110 599 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="623" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="646" font-size="14"><tspan x="92" dy="0">6. Kiểm tra đủ dòng và quyền phân công; lưu số đếm, người đếm, thời điểm và tiến độ. Nếu đợt</tspan><tspan x="92" dy="19">có QC/AC, vẫn chờ phần chất lượng hoàn tất. Không tự điều chỉnh tồn kho theo số đếm.</tspan><tspan x="92" dy="19">(PhieuKiemKe, ChiTietPhieuKiemKe, CongViec, LoLichKiemTra, PhanCongLichKiemTra)</tspan></text><path d="M790 714 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>