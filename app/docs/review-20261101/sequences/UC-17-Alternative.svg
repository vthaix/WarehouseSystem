<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 827" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="827" fill="#fafbfc"/><path d="M110 75 V817 M790 75 V817" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">5.1 Không đồng ý phương án đề xuất</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">1. Chủ xưởng chọn Không đồng ý, nhập lý do và hướng xử lý theo ý kiến của chủ xưởng.</tspan></text><path d="M110 235 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">2. Hệ thống lưu quyết định, lý do và hướng xử lý; thông báo cho Quản lý kho để thực hiện.</tspan><tspan x="92" dy="19">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 408 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="432" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="455" font-size="14"><tspan x="92" dy="0">5.2 Chưa nhập nội dung bắt buộc khi không đồng ý</tspan></text><path d="M110 485 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="509" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="532" font-size="14"><tspan x="92" dy="0">1. Chủ xưởng chọn Không đồng ý nhưng chưa nhập lý do hoặc hướng xử lý bắt buộc.</tspan></text><path d="M110 562 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="586" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="609" font-size="14"><tspan x="92" dy="0">2. Hệ thống yêu cầu bổ sung nội dung; chưa gửi quyết định. (BanDeXuatXuLyNgoaiLe,</tspan><tspan x="92" dy="19">KetQuaXuLyNgoaiLe)</tspan></text><path d="M110 658 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="682" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="705" font-size="14"><tspan x="92" dy="0">3. Quay lại bước 4 Khi gửi Chủ xưởng phê duyệt, hệ thống tự xác định chủ xưởng theo xưởng của</tspan><tspan x="92" dy="19">nguồn hàng; không chọn tùy ý một xưởng khác. Nếu nguồn chưa xác định được xưởng thì chưa cho</tspan><tspan x="92" dy="19">gửi. (Xuong, NguoiDung, BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe)</tspan></text><path d="M110 773 H790" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>