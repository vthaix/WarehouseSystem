<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 711" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="711" fill="#fafbfc"/><path d="M110 75 V701 M790 75 V701" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Phê duyệt kế hoạch mua/bán (KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị danh sách kế hoạch đang chờ phê duyệt (KeHoachMuaBan)</tspan></text><path d="M790 235 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">3. Chọn một kế hoạch để xem chi tiết (KeHoachMuaBan)</tspan></text><path d="M110 312 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="336" width="744" height="136" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="359" font-size="14"><tspan x="92" dy="0">4. Hiển thị kế hoạch, các dòng, ngày nhận hoặc ngày bán và nguồn nếu có. Kế hoạch mua trực</tspan><tspan x="92" dy="19">tiếp không bắt buộc có báo cáo; kế hoạch mua theo báo cáo lấy nhu cầu nguyên vật liệu; kế</tspan><tspan x="92" dy="19">hoạch bán đối chiếu báo cáo thành phẩm và lượng đạt chất lượng còn có thể sử dụng.</tspan><tspan x="92" dy="19">(KeHoachMuaBan, ChiTietKeHoachMuaBan, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang,</tspan><tspan x="92" dy="19">NguyenVatLieu, ThanhPham, TonKho, LoHang, ChiTietLo, KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 484 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="508" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="531" font-size="14"><tspan x="92" dy="0">5. Chọn Phê duyệt (KeHoachMuaBan)</tspan></text><path d="M110 561 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="585" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="608" font-size="14"><tspan x="92" dy="0">6. Cập nhật kế hoạch thành Đã duyệt: MUA cho phép lập đơn mua; BAN cho phép triển khai xuất</tspan><tspan x="92" dy="19">bán. Việc nhập kho chỉ thực hiện sau nhận hàng và QC đạt. (KeHoachMuaBan, ThongBao)</tspan></text><path d="M790 657 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>