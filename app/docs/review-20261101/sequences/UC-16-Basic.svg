<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 845" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="845" fill="#fafbfc"/><path d="M110 75 V835 M790 75 V835" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Xử lý chênh lệch kiểm kê (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Tự hiển thị các ngoại lệ từ biên bản đã gửi và các chênh lệch cần xử lý; không yêu cầu Quản</tspan><tspan x="92" dy="19">lý kho tự tạo lại vấn đề đã có. (PhieuKiemKe, ChiTietPhieuKiemKe, LoLichKiemTra,</tspan><tspan x="92" dy="19">BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Chọn vấn đề cần xử lý. (PhieuKiemKe, LoLichKiemTra, BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 350 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="374" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="397" font-size="14"><tspan x="92" dy="0">4. Hiển thị biên bản, kết quả số lượng hoặc chất lượng, mặt hàng, lô, lượng liên quan và mô tả</tspan><tspan x="92" dy="19">ngoại lệ; mở form xử lý. (PhieuKiemKe, ChiTietPhieuKiemKe, KetQuaKiemTraQCAC,</tspan><tspan x="92" dy="19">ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo, MatHang, NguyenVatLieu, ThanhPham,</tspan><tspan x="92" dy="19">BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 484 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="508" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="531" font-size="14"><tspan x="92" dy="0">5. Nhập cách xử lý; nếu cần xin ý kiến, chọn gửi đề xuất cho Chủ xưởng và nhập nội dung đề</tspan><tspan x="92" dy="19">nghị. (PhieuKiemKe, LoLichKiemTra, BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 580 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="604" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="627" font-size="14"><tspan x="92" dy="0">6. Xác nhận nội dung xử lý.</tspan></text><path d="M110 657 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="681" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="704" font-size="14"><tspan x="92" dy="0">7. Lưu cách xử lý hoặc gửi đề xuất chờ Chủ xưởng phê duyệt. Vấn đề đơn giản có thể xác nhận xử</tspan><tspan x="92" dy="19">lý trực tiếp bằng mô tả; nếu cần điều chỉnh tồn kho, phải thực hiện bước chứng từ và phê duyệt</tspan><tspan x="92" dy="19">tương ứng, không chỉ sửa số tồn bằng ghi chú. (PhieuKiemKe, LoLichKiemTra,</tspan><tspan x="92" dy="19">BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M790 791 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>