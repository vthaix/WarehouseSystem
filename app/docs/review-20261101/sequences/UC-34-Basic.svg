<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1902" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="1902" fill="#fafbfc"/><path d="M110 75 V1892 M790 75 V1892" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Lập phiếu báo cáo sản xuất. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị form báo cáo sản xuất. (KeHoachSanXuat, Xuong)</tspan></text><path d="M790 235 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="259" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="282" font-size="14"><tspan x="92" dy="0">3. Chọn kế hoạch sản xuất và mục đích báo cáo: tiến độ, sự cố hoặc nhu cầu nguyên vật liệu.</tspan><tspan x="92" dy="19">(KeHoachSanXuat)</tspan></text><path d="M110 331 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="355" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="378" font-size="14"><tspan x="92" dy="0">4. Hiển thị kế hoạch, xưởng và các nội dung phù hợp với mục đích báo cáo. Với báo cáo nhu cầu,</tspan><tspan x="92" dy="19">lấy lượng nguyên vật liệu ước lượng từ kế hoạch. (KeHoachSanXuat, ChiTietKeHoachSanXuat,</tspan><tspan x="92" dy="19">Xuong, MatHang, NguyenVatLieu)</tspan></text><path d="M790 446 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="470" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="493" font-size="14"><tspan x="92" dy="0">5. Với báo cáo nhu cầu, hiển thị lượng tồn khả dụng từ hệ thống; không coi toàn bộ lượng đã</tspan><tspan x="92" dy="19">dành cho nhu cầu khác là lượng còn có thể cấp. (TonKho, PhanCongKho, ChiTietLo, MatHang,</tspan><tspan x="92" dy="19">NguyenVatLieu)</tspan></text><path d="M790 561 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="585" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="608" font-size="14"><tspan x="92" dy="0">6. Nhập tiến độ sản xuất hiện tại. (BanBaoCaoSanXuat)</tspan></text><path d="M110 638 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="662" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="685" font-size="14"><tspan x="92" dy="0">7. Nhập mô tả tình hình sản xuất, vấn đề phát sinh hoặc nội dung cần báo cáo.</tspan><tspan x="92" dy="19">(BanBaoCaoSanXuat)</tspan></text><path d="M110 734 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="758" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="781" font-size="14"><tspan x="92" dy="0">8. Với báo cáo nhu cầu, đối chiếu lượng có thể cấp với lượng ước lượng cần dùng.</tspan><tspan x="92" dy="19">(KeHoachSanXuat, ChiTietKeHoachSanXuat, TonKho, PhanCongKho, MatHang, NguyenVatLieu)</tspan></text><path d="M790 830 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="854" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="877" font-size="14"><tspan x="92" dy="0">9. Tính lượng thiếu của từng nguyên vật liệu, không nhỏ hơn 0; xác định đủ hoặc thiếu. Báo cáo</tspan><tspan x="92" dy="19">tiến độ hoặc sự cố không bắt buộc phải có dòng nguyên vật liệu. (ChiTietKeHoachSanXuat,</tspan><tspan x="92" dy="19">TonKho, PhanCongKho, MatHang, NguyenVatLieu)</tspan></text><path d="M790 945 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="969" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="992" font-size="14"><tspan x="92" dy="0">10. Hiển thị nội dung báo cáo và người nhận mặc định là Ban giám đốc. (BanBaoCaoSanXuat,</tspan><tspan x="92" dy="19">NguoiDung, NguoiDungVaiTro, VaiTro)</tspan></text><path d="M790 1041 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1065" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1088" font-size="14"><tspan x="92" dy="0">11. Chọn gửi thêm Bộ phận lập kế hoạch nếu cần. Với báo cáo nhu cầu còn thiếu nguyên vật liệu,</tspan><tspan x="92" dy="19">hệ thống tự gửi thêm bộ phận này. (BanBaoCaoSanXuat, NguoiDung, NguoiDungVaiTro, VaiTro)</tspan></text><path d="M110 1137 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1161" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1184" font-size="14"><tspan x="92" dy="0">12. Xác nhận gửi báo cáo.</tspan></text><path d="M110 1214 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1238" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1261" font-size="14"><tspan x="92" dy="0">13. Kiểm tra thông tin báo cáo, tiến độ và quyền đối với kế hoạch, xưởng. (KeHoachSanXuat,</tspan><tspan x="92" dy="19">ChiTietKeHoachSanXuat, NguoiDungXuong, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 1310 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1334" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1357" font-size="14"><tspan x="92" dy="0">14. Lưu báo cáo sản xuất với thời gian lập, mục đích, tiến độ và mô tả, liên kết kế hoạch sản</tspan><tspan x="92" dy="19">xuất và xưởng. (BanBaoCaoSanXuat)</tspan></text><path d="M790 1406 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1430" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1453" font-size="14"><tspan x="92" dy="0">15. Đối với báo cáo nhu cầu, lưu từng nguyên vật liệu, lượng có thể cấp, lượng cần dùng và</tspan><tspan x="92" dy="19">lượng còn thiếu. (ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 1502 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1526" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1549" font-size="14"><tspan x="92" dy="0">16. Gửi báo cáo đến Ban giám đốc. (BanBaoCaoSanXuat, ThongBao, NguoiDung, NguoiDungVaiTro,</tspan><tspan x="92" dy="19">VaiTro)</tspan></text><path d="M790 1598 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1622" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1645" font-size="14"><tspan x="92" dy="0">17. Gửi thêm Bộ phận lập kế hoạch nếu Chủ xưởng đã chọn hoặc nếu là báo cáo nhu cầu còn thiếu</tspan><tspan x="92" dy="19">nguyên vật liệu. (BanBaoCaoSanXuat, ThongBao, NguoiDung, NguoiDungVaiTro, VaiTro)</tspan></text><path d="M790 1694 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1718" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1741" font-size="14"><tspan x="92" dy="0">18. Hiển thị thông báo “Gửi báo cáo thành công”.</tspan></text><path d="M790 1771 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="1795" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="1818" font-size="14"><tspan x="92" dy="0">19. Kết thúc use case.</tspan></text><path d="M790 1848 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>