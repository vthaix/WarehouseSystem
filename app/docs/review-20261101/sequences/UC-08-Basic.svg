<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="538" fill="#fafbfc"/><path d="M110 75 V528 M790 75 V528" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn chức năng Quản lý nhập kho</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị yêu cầu nhập trong phạm vi phụ trách và phần Phiếu đã ghi sổ để xem kết quả thực</tspan><tspan x="92" dy="19">nhập. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho, PhieuKho)</tspan></text><path d="M790 254 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="278" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="301" font-size="14"><tspan x="92" dy="0">3. Chọn một yêu cầu nhập để xem nguồn hàng, phần còn phải thực hiện; hoặc chọn phiếu đã ghi sổ</tspan><tspan x="92" dy="19">để đối chiếu. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhieuKho)</tspan></text><path d="M110 350 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="374" width="744" height="98" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="397" font-size="14"><tspan x="92" dy="0">4. Hiển thị nguồn nhập, xưởng, kho, ngày giờ đề nghị, từng phần lô, số lượng và phân công; nếu</tspan><tspan x="92" dy="19">xem phiếu đã ghi sổ thì hiển thị kết quả thực nhập. (PhieuYeuCauNhapXuat,</tspan><tspan x="92" dy="19">ChiTietPhieuYeuCauNhapXuat, Xuong, PhanCongKho, PhieuKho, ChiTietPhieuKho, MatHang,</tspan><tspan x="92" dy="19">NguyenVatLieu, ThanhPham, LoHang, ChiTietLo, Kho, ViTriKho)</tspan></text><path d="M790 484 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>