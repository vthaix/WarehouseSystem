<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 577" role="img" aria-label="Biểu đồ tương tác"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#16784a"/></marker></defs><rect width="900" height="577" fill="#fafbfc"/><path d="M110 75 V567 M790 75 V567" stroke="#a4abb9" stroke-dasharray="5 5"/><rect x="15" y="16" width="350" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="190" y="49" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="655" y="16" width="230" height="58" rx="8" fill="#fff" stroke="#abb2c1"/><text x="770" y="49" text-anchor="middle" font-size="16">Hệ thống</text><g><rect x="78" y="105" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="128" font-size="14"><tspan x="92" dy="0">1. Chọn Thêm dữ liệu (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 158 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="182" width="744" height="79" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="205" font-size="14"><tspan x="92" dy="0">2. Hiển thị form của loại dữ liệu đang thêm. Đối với mặt hàng, hiển thị tên, danh mục, đơn vị</tspan><tspan x="92" dy="19">tính, giá, ảnh, mô tả và trạng thái theo các trường được phép nhập; mã và thời điểm tạo do hệ</tspan><tspan x="92" dy="19">thống ghi nhận. (MatHang, NguyenVatLieu, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 273 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="297" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="320" font-size="14"><tspan x="92" dy="0">3. Nhập thông tin và xác nhận (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 350 H790" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="374" width="744" height="41" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="397" font-size="14"><tspan x="92" dy="0">4. Kiểm tra dữ liệu nhập (MatHang, NguyenVatLieu, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 427 H110" stroke="#16784a" marker-end="url(#arrow)"/></g><g><rect x="78" y="451" width="744" height="60" rx="7" fill="#fff" stroke="#d7dbe3"/><text x="92" y="474" font-size="14"><tspan x="92" dy="0">5. Lưu dữ liệu mới vào hệ thống và thông báo thêm thành công (MatHang, NguyenVatLieu,</tspan><tspan x="92" dy="19">ThanhPham)</tspan></text><path d="M790 523 H110" stroke="#16784a" marker-end="url(#arrow)"/></g></svg>