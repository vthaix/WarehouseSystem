<svg xmlns="http://www.w3.org/2000/svg" width="900" height="742" viewBox="0 0 900 742"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="742" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-10 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V732 M790 110 V732" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Nhân viên kho điều chỉnh lượng thực nhập trong giới hạn còn được nhập và ghi chú thực tế</tspan><tspan x="58" dy="20">nếu cần.</tspan></text><path d="M110 214 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">2. Hệ thống ghi nhận đúng lượng thực nhập; lượng còn lại chưa được coi là đã nhập.</tspan><tspan x="58" dy="20">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho)</tspan></text><path d="M790 319 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="340" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="364" font-size="16"><tspan x="58" dy="0">3. Tiếp tục bước 5; phần còn lại thực hiện bằng lần ghi nhận sau khi còn đủ điều kiện. Nếu</tspan><tspan x="58" dy="20">vị trí thực tế cần thay đổi, liên hệ Quản lý kho điều chỉnh phần chưa thực hiện trước khi</tspan><tspan x="58" dy="20">ghi phiếu; không tự chuyển vị trí bằng thao tác nhập. (PhanCongKho, ViTriKho)</tspan></text><path d="M110 444 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="465" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="487" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="507" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="531" font-size="16"><tspan x="58" dy="0">4.1 Thông tin nhập kho không hợp lệ</tspan></text><path d="M110 571 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="592" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="616" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo lỗi và yêu cầu nhập lại (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, PhanCongKho)</tspan></text><path d="M790 676 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>