<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1084" viewBox="0 0 900 1084"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1084" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-07.1 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1074 M790 110 V1074" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Thêm dữ liệu (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form của loại dữ liệu đang thêm. Đối với mặt hàng, hiển thị tên, danh mục, đơn</tspan><tspan x="58" dy="20">vị tính, giá, ảnh, mô tả và trạng thái theo các trường được phép nhập; mã và thời điểm tạo</tspan><tspan x="58" dy="20">do hệ thống ghi nhận. (MatHang, NguyenVatLieu, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Nhập thông tin và xác nhận (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Kiểm tra dữ liệu nhập (MatHang, NguyenVatLieu, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 531 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="552" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="576" font-size="16"><tspan x="58" dy="0">5. Lưu dữ liệu mới vào hệ thống và thông báo thêm thành công (MatHang, NguyenVatLieu,</tspan><tspan x="58" dy="20">ThanhPham)</tspan></text><path d="M790 636 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="657" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="679" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="699" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="723" font-size="16"><tspan x="58" dy="0">3.1 Hủy trước khi xác nhận</tspan></text><path d="M110 763 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="784" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="808" font-size="16"><tspan x="58" dy="0">1. Quản lý kho chọn Hủy</tspan></text><path d="M110 848 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="869" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="893" font-size="16"><tspan x="58" dy="0">2. Hệ thống hủy thông tin đã nhập</tspan></text><path d="M790 933 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="954" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="978" font-size="16"><tspan x="58" dy="0">3. Kết thúc use case</tspan></text><path d="M110 1018 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>