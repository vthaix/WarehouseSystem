<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1059" viewBox="0 0 900 1059"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1059" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-05.1 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1049 M790 110 V1049" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Sửa (KeHoachMuaBan, KeHoachSanXuat)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form với thông tin kế hoạch hiện tại (KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="58" dy="20">KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nhập thông tin cần chỉnh sửa và xác nhận (KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="58" dy="20">KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Kiểm tra thông tin, trạng thái kế hoạch và lượng sửa so với báo cáo nguồn.</tspan><tspan x="58" dy="20">(KeHoachMuaBan, ChiTietKeHoachMuaBan, KeHoachSanXuat, ChiTietKeHoachSanXuat,</tspan><tspan x="58" dy="20">BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 571 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="592" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="616" font-size="16"><tspan x="58" dy="0">5. Lưu cập nhật vào hệ thống (KeHoachMuaBan, ChiTietKeHoachMuaBan, KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat)</tspan></text><path d="M790 676 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="697" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="721" font-size="16"><tspan x="58" dy="0">6. Thông báo kế hoạch đã được cập nhật (KeHoachMuaBan, ChiTietKeHoachMuaBan, KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat)</tspan></text><path d="M790 781 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="802" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="824" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="844" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="868" font-size="16"><tspan x="58" dy="0">1.1 Hủy trước khi xác nhận</tspan></text><path d="M110 908 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="929" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="953" font-size="16"><tspan x="58" dy="0">1. Nhân viên chọn Hủy</tspan></text><path d="M110 993 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>