<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1082" viewBox="0 0 900 1082"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1082" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-17 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1072 M790 110 V1072" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">2. Hệ thống lưu quyết định, lý do và hướng xử lý; thông báo cho Quản lý kho để thực hiện.</tspan><tspan x="58" dy="20">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M790 214 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 299 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="320" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="344" font-size="16"><tspan x="58" dy="0">5.2 Chưa nhập nội dung bắt buộc khi không đồng ý</tspan></text><path d="M110 384 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="405" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="429" font-size="16"><tspan x="58" dy="0">1. Chủ xưởng chọn Không đồng ý nhưng chưa nhập lý do hoặc hướng xử lý bắt buộc.</tspan></text><path d="M110 469 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="490" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="514" font-size="16"><tspan x="58" dy="0">2. Hệ thống yêu cầu bổ sung nội dung; chưa gửi quyết định. (BanDeXuatXuLyNgoaiLe,</tspan><tspan x="58" dy="20">KetQuaXuLyNgoaiLe)</tspan></text><path d="M790 574 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="595" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="619" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 4 Khi gửi Chủ xưởng phê duyệt, hệ thống tự xác định chủ xưởng theo xưởng</tspan><tspan x="58" dy="20">của nguồn hàng; không chọn tùy ý một xưởng khác. Nếu nguồn chưa xác định được xưởng thì chưa</tspan><tspan x="58" dy="20">cho gửi. (Xuong, NguoiDung, BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe)</tspan></text><path d="M110 699 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="720" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="742" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="762" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="786" font-size="16"><tspan x="58" dy="0">2.1 Không có đề xuất nào đang chờ phê duyệt</tspan></text><path d="M110 826 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="847" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="871" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không có đề xuất nào đang chờ phê duyệt (BanDeXuatXuLyNgoaiLe,</tspan><tspan x="58" dy="20">KetQuaXuLyNgoaiLe)</tspan></text><path d="M790 931 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="952" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="976" font-size="16"><tspan x="58" dy="0">2. Kết thúc use case</tspan></text><path d="M110 1016 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>