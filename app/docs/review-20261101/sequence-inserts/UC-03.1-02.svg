<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1022" viewBox="0 0 900 1022"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1022" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-03.1 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Khách hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1012 M790 110 V1012" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">5.1 Nếu khách hàng tăng số lượng đơn hàng</tspan></text><path d="M110 194 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">1. Hệ thống yêu cầu xác nhận việc thay đổi số lượng; khách hàng kiểm tra lại số lượng và</tspan><tspan x="58" dy="20">ngày nhận mong muốn. (DonHang, ChiTietDonHang)</tspan></text><path d="M790 299 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="320" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="344" font-size="16"><tspan x="58" dy="0">2. Khách hàng chọn xác nhận</tspan></text><path d="M110 384 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="405" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="429" font-size="16"><tspan x="58" dy="0">3. Đi đến bước 6</tspan></text><path d="M110 469 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="490" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="514" font-size="16"><tspan x="58" dy="0">5.2 Nếu khách hàng giảm số lượng đơn hàng</tspan></text><path d="M110 554 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="575" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="599" font-size="16"><tspan x="58" dy="0">1. Hệ thống yêu cầu khách hàng kiểm tra và xác nhận việc giảm số lượng. (DonHang,</tspan><tspan x="58" dy="20">ChiTietDonHang)</tspan></text><path d="M790 659 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="680" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="704" font-size="16"><tspan x="58" dy="0">2. Khách hàng chọn xác nhận</tspan></text><path d="M110 744 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="765" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="789" font-size="16"><tspan x="58" dy="0">3. Đi đến bước 6</tspan></text><path d="M110 829 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="850" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="872" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="892" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="916" font-size="16"><tspan x="58" dy="0">1.1 Đơn hàng không ở trạng thái cho phép sửa</tspan></text><path d="M110 956 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>