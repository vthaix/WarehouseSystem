<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1086" viewBox="0 0 900 1086"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1086" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-06.1 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1076 M790 110 V1076" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Thêm danh mục (LoaiHang)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form thêm danh mục gồm tên danh mục, nhóm nguyên vật liệu hoặc thành phẩm, mô tả</tspan><tspan x="58" dy="20">và ảnh nếu có. (LoaiHang)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nhập tên danh mục, mô tả và xác nhận (LoaiHang)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Kiểm tra dữ liệu vừa được nhập (LoaiHang)</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="532" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="556" font-size="16"><tspan x="58" dy="0">5. Lưu danh mục mới vào hệ thống và thông báo thêm thành công (LoaiHang)</tspan></text><path d="M790 596 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="617" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="639" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="659" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="683" font-size="16"><tspan x="58" dy="0">3.1 Hủy trước khi xác nhận</tspan></text><path d="M110 723 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="744" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="768" font-size="16"><tspan x="58" dy="0">1. Quản lý kho chọn Hủy; hệ thống không thêm danh mục.</tspan></text><path d="M110 808 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="829" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="853" font-size="16"><tspan x="58" dy="0">2. Quay lại danh sách danh mục của UC-06.</tspan></text><path d="M110 893 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="914" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="936" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="956" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="980" font-size="16"><tspan x="58" dy="0">4.1 Tên danh mục đã tồn tại</tspan></text><path d="M110 1020 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>