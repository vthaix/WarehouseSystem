<svg xmlns="http://www.w3.org/2000/svg" width="900" height="907" viewBox="0 0 900 907"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="907" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-31 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V897 M790 110 V897" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">2. Hệ thống lưu kế hoạch bị từ chối cùng lý do, cập nhật thông tin liên quan và thông báo</tspan><tspan x="58" dy="20">cho Bộ phận lập kế hoạch. Không coi việc từ chối một kế hoạch là hủy mọi kế hoạch hoặc chứng</tspan><tspan x="58" dy="20">từ của đơn hàng. (DonHang, ThongBao, KeHoachSanXuat)</tspan></text><path d="M790 234 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="255" width="810" height="170" fill="white" stroke="#cad7ce"/><text x="58" y="279" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 15.2 Sản lượng dự kiến vượt số lượng đơn hàng1. Hệ thống hiển thị nội dung</tspan><tspan x="58" dy="20">vượt số lượng để Ban giám đốc xem xét. (KeHoachSanXuat, DonHang)2. Nếu chọn Tiếp tục, hệ</tspan><tspan x="58" dy="20">thống kiểm tra các điều kiện còn lại và phê duyệt. (KeHoachSanXuat, DonHang)3. Nếu chọn Quay</tspan><tspan x="58" dy="20">lại, không phê duyệt và giữ nguyên kế hoạch. Chứng từ còn cần xử lý được làm nổi bật và hiển</tspan><tspan x="58" dy="20">thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không</tspan><tspan x="58" dy="20">kết thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp</tspan><tspan x="58" dy="20">lệ. (ThongBao, CongViec)</tspan></text><path d="M110 439 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="460" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="482" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="502" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="526" font-size="16"><tspan x="58" dy="0">2.1 Danh sách kế hoạch sản xuất chờ phê duyệt rỗng</tspan></text><path d="M110 566 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="587" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="611" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không có kế hoạch sản xuất cần phê duyệt. (KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat)2. Kết thúc UC.</tspan></text><path d="M790 671 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="692" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="716" font-size="16"><tspan x="58" dy="0">4.1 Kế hoạch không còn chờ phê duyệt</tspan></text><path d="M110 756 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="777" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="801" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo kế hoạch không còn được phép phê duyệt.</tspan></text><path d="M790 841 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>