<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1057" viewBox="0 0 900 1057"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1057" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-27 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận mua hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1047 M790 110 V1047" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Mua hàng</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị hai hình thức Lập trực tiếp và Theo kế hoạch mua nguyên vật liệu.</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn Theo kế hoạch mua nguyên vật liệu và chọn kế hoạch đã được duyệt. (KeHoachMuaBan)</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Hiển thị danh sách nguyên vật liệu, số lượng và ngày nhận mong muốn của kế hoạch; hiển</tspan><tspan x="58" dy="20">thị báo cáo nguồn nếu kế hoạch có báo cáo. (KeHoachMuaBan, ChiTietKeHoachMuaBan, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, DonViTinh, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 531 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="552" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="576" font-size="16"><tspan x="58" dy="0">5. Chọn nhà cung cấp cho từng nguyên vật liệu; kiểm tra đơn vị, nhập giá thỏa thuận, điều</tspan><tspan x="58" dy="20">kiện giao hàng và ghi chú. (MatHang, NguyenVatLieu, NhaCungCap, DonViTinh)</tspan></text><path d="M110 636 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="657" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="681" font-size="16"><tspan x="58" dy="0">6. Kiểm tra mặt hàng, nhà cung cấp từng dòng, lượng mua, đơn giá, ngày nhận và kế hoạch</tspan><tspan x="58" dy="20">nguồn. Ngày nhận của đơn theo kế hoạch được lấy từ kế hoạch mua. (KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan, MatHang, NguyenVatLieu, NhaCungCap, DonViTinh, DonMuaHang,</tspan><tspan x="58" dy="20">ChiTietDonMuaHang)</tspan></text><path d="M790 781 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="802" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="826" font-size="16"><tspan x="58" dy="0">7. Xác nhận mua hàng</tspan></text><path d="M110 866 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="887" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="911" font-size="16"><tspan x="58" dy="0">8. Tạo đơn mua và các dòng nguyên vật liệu, nhà cung cấp tương ứng; ghi nhận kế hoạch và báo</tspan><tspan x="58" dy="20">cáo nguồn nếu có; thông báo mua hàng thành công. Chưa tạo hàng thực nhận hoặc tăng tồn kho.</tspan><tspan x="58" dy="20">(DonMuaHang, ChiTietDonMuaHang, KeHoachMuaBan, BanBaoCaoSanXuat)</tspan></text><path d="M790 991 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>