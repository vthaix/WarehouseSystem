<svg xmlns="http://www.w3.org/2000/svg" width="900" height="954" viewBox="0 0 900 954"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="954" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-08 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V944 M790 110 V944" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Quản lý nhập kho</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị yêu cầu nhập trong phạm vi phụ trách và phần Phiếu đã ghi sổ để xem kết quả thực</tspan><tspan x="58" dy="20">nhập. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho, PhieuKho)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Chọn một yêu cầu nhập để xem nguồn hàng, phần còn phải thực hiện; hoặc chọn phiếu đã ghi</tspan><tspan x="58" dy="20">sổ để đối chiếu. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhieuKho)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Hiển thị nguồn nhập, xưởng, kho, ngày giờ đề nghị, từng phần lô, số lượng và phân công;</tspan><tspan x="58" dy="20">nếu xem phiếu đã ghi sổ thì hiển thị kết quả thực nhập. (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, Xuong, PhanCongKho, PhieuKho, ChiTietPhieuKho, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, ThanhPham, LoHang, ChiTietLo, Kho, ViTriKho)</tspan></text><path d="M790 591 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="612" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="634" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="654" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="678" font-size="16"><tspan x="58" dy="0">3.1 Tìm kiếm phiếu nhập kho</tspan></text><path d="M110 718 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="739" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="763" font-size="16"><tspan x="58" dy="0">1. Nhập mã phiếu để tìm kiếm phiếu nhập kho (PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M110 803 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="824" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="848" font-size="16"><tspan x="58" dy="0">2. Hệ thống hiển thị các phiếu nhập kho phù hợp (PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 888 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>