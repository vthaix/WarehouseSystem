<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1037" viewBox="0 0 900 1037"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1037" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-32 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1027 M790 110 V1027" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">2. Hệ thống cập nhật trạng thái kế hoạch bị từ chối và thông báo cho Bộ phận lập kế hoạch</tspan><tspan x="58" dy="20">(ThongBao, KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M790 214 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">3. Kết thúc UC</tspan></text><path d="M110 299 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="320" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="344" font-size="16"><tspan x="58" dy="0">5.2 Từ chối kế hoạch và không nhập lý do</tspan></text><path d="M110 384 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="405" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="429" font-size="16"><tspan x="58" dy="0">1. Ban giám đốc chọn Từ chối và không nhập lý do</tspan></text><path d="M110 469 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="490" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="514" font-size="16"><tspan x="58" dy="0">2. Hệ thống thông báo yêu cầu nhập lý do từ chối</tspan></text><path d="M790 554 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="575" width="810" height="170" fill="white" stroke="#cad7ce"/><text x="58" y="599" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 45.3 Lượng dự kiến vượt nguồn1. Hệ thống hiển thị cảnh báo phần vượt.</tspan><tspan x="58" dy="20">(KeHoachMuaBan, ChiTietKeHoachMuaBan)2. Ban giám đốc chọn Tiếp tục để duyệt sau khi các điều</tspan><tspan x="58" dy="20">kiện còn lại hợp lệ, hoặc chọn Quay lại để chưa duyệt.3. Xác nhận vượt dự kiến không thay</tspan><tspan x="58" dy="20">thế điều kiện tồn kho và chất lượng khi thực hiện. (TonKho, PhanCongKho) Chứng từ còn cần xử</tspan><tspan x="58" dy="20">lý được làm nổi bật và hiển thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem</tspan><tspan x="58" dy="20">hoặc đọc thông báo không kết thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ</tspan><tspan x="58" dy="20">hoặc nguồn không còn hợp lệ. (ThongBao, CongViec)</tspan></text><path d="M110 759 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="780" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="802" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="822" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="846" font-size="16"><tspan x="58" dy="0">4.1 Không có kế hoạch đang chờ phê duyệt trong hệ thống</tspan></text><path d="M110 886 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="907" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="931" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không có kế hoạch đang chờ phê duyệt</tspan></text><path d="M790 971 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>