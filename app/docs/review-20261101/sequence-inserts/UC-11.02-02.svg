<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1054" viewBox="0 0 900 1054"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1054" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-11.02 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1044 M790 110 V1044" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">8. Cập nhật trạng thái lô, lượng đã giao của đơn và lượng đã thực hiện của kế hoạch BAN.</tspan><tspan x="58" dy="20">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho, CongViec, DonHang,</tspan><tspan x="58" dy="20">KeHoachMuaBan)</tspan></text><path d="M790 234 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="255" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="279" font-size="16"><tspan x="58" dy="0">9. Thông báo xuất kho thành công và hiển thị phiếu xuất kho (PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 319 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="340" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="362" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="382" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3.1 Chưa thể xuất theo thực tế</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">1. Nhân viên kho không xác nhận xuất khi thiếu hàng hoặc phát hiện hàng không đủ điều kiện;</tspan><tspan x="58" dy="20">liên hệ Quản lý kho để kiểm tra và điều chỉnh theo quyền. (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, PhanCongKho)</tspan></text><path d="M110 571 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="592" width="810" height="170" fill="white" stroke="#cad7ce"/><text x="58" y="616" font-size="16"><tspan x="58" dy="0">2. Khi chưa ghi phiếu, hệ thống không trừ tồn. Nếu cần xử lý ngoại lệ, Quản lý kho thực hiện</tspan><tspan x="58" dy="20">tại UC-16; không tự tạo đề xuất hoặc tự đổi yêu cầu sang Chờ duyệt lại.</tspan><tspan x="58" dy="20">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">PhanCongKho)3.2 Xuất một phần lượng được giao1. Nhân viên kho nhập lượng thực xuất nhỏ hơn</tspan><tspan x="58" dy="20">lượng còn được phép. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, PhanCongKho)2. Hệ</tspan><tspan x="58" dy="20">thống cập nhật đúng lượng thực xuất, giữ phần chưa xuất để xử lý tiếp. (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, PhanCongKho)3. Tiếp tục bước 5.</tspan></text><path d="M110 776 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="797" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="819" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="839" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="863" font-size="16"><tspan x="58" dy="0">6.1 Tồn kho không đủ hoặc lô không còn khả dụng</tspan></text><path d="M110 903 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="924" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="948" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo lỗi, không lập phiếu xuất kho (PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 988 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>