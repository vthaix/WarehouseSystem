<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1057" viewBox="0 0 900 1057"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1057" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-07 — Sequence · Tiếp nối 2/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1047 M790 110 V1047" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-07.1</tspan></text><path d="M790 194 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">4.1 Chọn Xóa</tspan></text><path d="M110 279 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-07.2</tspan></text><path d="M790 364 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">4.2 Chọn Sửa</tspan></text><path d="M110 449 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="470" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="494" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-07.3</tspan></text><path d="M790 534 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="555" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="577" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="597" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="621" font-size="16"><tspan x="58" dy="0">2.1 Không có dữ liệu</tspan></text><path d="M110 661 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="682" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="706" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không tìm thấy dữ liệu (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M790 746 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="767" width="810" height="210" fill="white" stroke="#cad7ce"/><text x="58" y="791" font-size="16"><tspan x="58" dy="0">2. Quay lại bước 13.3 Nếu phiên đăng nhập hết hạn hoặc người dùng không có quyền thao tác1.</tspan><tspan x="58" dy="20">Hệ thống yêu cầu đăng nhập lại hoặc thông báo không có quyền. (NguoiDung, NguoiDungVaiTro,</tspan><tspan x="58" dy="20">VaiTro, PhienDangNhap)2. Không thực hiện thay đổi chưa được cho phép.3.4 Nếu dữ liệu vừa bị</tspan><tspan x="58" dy="20">người khác thay đổi hoặc không còn tồn tại1. Hệ thống thông báo và không lưu đè thông tin</tspan><tspan x="58" dy="20">cũ. (MatHang, NguyenVatLieu, ThanhPham)2. Người dùng tải lại danh sách hoặc chi tiết trước</tspan><tspan x="58" dy="20">khi thực hiện lại.3.5 Nếu không kết nối được khi xác nhận1. Hệ thống thông báo thao tác chưa</tspan><tspan x="58" dy="20">có kết quả xác định.2. Khi kết nối trở lại, người dùng kiểm tra danh sách hoặc chi tiết để</tspan><tspan x="58" dy="20">biết lần trước đã được ghi nhận chưa rồi mới thử lại; không mặc định bấm lại là tạo chứng từ</tspan><tspan x="58" dy="20">mới.</tspan></text><path d="M110 991 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>