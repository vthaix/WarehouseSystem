<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1020" viewBox="0 0 900 1020"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1020" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-23 — Sequence · Tiếp nối 4/6</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1010 M790 110 V1010" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không có nguồn hợp lệ để lập yêu cầu; không lưu yêu cầu.</tspan><tspan x="58" dy="20">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 214 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">2. Đi đến bước 3 của luồng cơ bản.</tspan></text><path d="M110 299 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="320" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="344" font-size="16"><tspan x="58" dy="0">3.2 Chưa có phần hàng thực nhận hoặc chưa có báo cáo thành phẩm đã gửi</tspan></text><path d="M110 384 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="405" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="429" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo chưa có dữ liệu nguồn phù hợp; không tự tạo lô chỉ vì đã có kế hoạch</tspan><tspan x="58" dy="20">hoặc đến ngày dự kiến. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 489 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="510" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="534" font-size="16"><tspan x="58" dy="0">2. Chủ xưởng kiểm tra lại việc ghi nhận hàng về hoặc gửi báo cáo rồi thực hiện lại.</tspan><tspan x="58" dy="20">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M110 594 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="615" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="639" font-size="16"><tspan x="58" dy="0">6.1 Thiếu thông tin hoặc số lượng không hợp lệ</tspan></text><path d="M110 679 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="700" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="724" font-size="16"><tspan x="58" dy="0">1. Hệ thống yêu cầu nhập đầy đủ thông tin và số lượng lớn hơn 0; không lưu yêu cầu.</tspan><tspan x="58" dy="20">(PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 784 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="805" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="829" font-size="16"><tspan x="58" dy="0">2. Đi đến bước 3 của luồng cơ bản.</tspan></text><path d="M110 869 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="890" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="914" font-size="16"><tspan x="58" dy="0">7.1 Không đủ điều kiện, trùng hoặc vượt lượng được phép</tspan></text><path d="M110 954 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>