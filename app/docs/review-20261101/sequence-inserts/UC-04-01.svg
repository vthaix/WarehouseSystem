<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1057" viewBox="0 0 900 1057"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1057" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-04 — Sequence · Tiếp nối 1/5</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1047 M790 110 V1047" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Lập kế hoạch mua/bán (KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form lập kế hoạch với loại kế hoạch và nguồn phù hợp; đối với kế hoạch mua</tspan><tspan x="58" dy="20">nguyên vật liệu, có hai hình thức Lập trực tiếp và Theo báo cáo sản xuất. (BanBaoCaoSanXuat,</tspan><tspan x="58" dy="20">KeHoachSanXuat, DonHang)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Chọn kế hoạch mua nguyên vật liệu, hình thức Theo báo cáo sản xuất và báo cáo nhu cầu đã</tspan><tspan x="58" dy="20">gửi có nguyên vật liệu còn thiếu. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M110 466 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="487" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="511" font-size="16"><tspan x="58" dy="0">4. Hệ thống lấy danh sách nguyên vật liệu và lượng thiếu; Bộ phận lập kế hoạch kiểm tra</tspan><tspan x="58" dy="20">lượng mua, đơn giá dự kiến, chọn ngày nhận mong muốn và nhập ghi chú. Không chọn nhà cung</tspan><tspan x="58" dy="20">cấp ở bước lập kế hoạch. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang, NguyenVatLieu,</tspan><tspan x="58" dy="20">DonViTinh)</tspan></text><path d="M790 611 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="632" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="656" font-size="16"><tspan x="58" dy="0">5. Kiểm tra loại báo cáo, số lượng còn thiếu và thông tin kế hoạch. (BanBaoCaoSanXuat,</tspan><tspan x="58" dy="20">ChiTietBaoCaoSanXuat, KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M790 716 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="737" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="761" font-size="16"><tspan x="58" dy="0">6. Tính tổng tiền dựa trên đơn giá * số lượng (ChiTietKeHoachMuaBan)</tspan></text><path d="M790 801 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="822" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="846" font-size="16"><tspan x="58" dy="0">7. Chọn Xác nhận</tspan></text><path d="M110 886 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="907" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="931" font-size="16"><tspan x="58" dy="0">8. Lưu kế hoạch và chi tiết, ghi nhận báo cáo nguồn nếu có, chuyển sang Chờ phê duyệt và</tspan><tspan x="58" dy="20">thông báo thành công. (KeHoachMuaBan, ChiTietKeHoachMuaBan, BanBaoCaoSanXuat, ThongBao)</tspan></text><path d="M790 991 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>