<svg xmlns="http://www.w3.org/2000/svg" width="900" height="895" viewBox="0 0 900 895"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="895" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-02 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Khách hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V885 M790 110 V885" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">2.1 Danh sách hàng mẫu không có</tspan></text><path d="M110 194 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo danh sách hàng mẫu đang rỗng</tspan></text><path d="M790 279 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">2. Kết thúc UC</tspan></text><path d="M110 364 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">5.1 Thông tin đơn hàng không hợp lệ</tspan></text><path d="M110 449 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="470" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="494" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo lỗi (thiếu thông