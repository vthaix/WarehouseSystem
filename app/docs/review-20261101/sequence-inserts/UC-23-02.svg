<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1082" viewBox="0 0 900 1082"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1082" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-23 — Sequence · Tiếp nối 2/6</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1072 M790 110 V1072" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">8. Lưu yêu cầu Chờ xử lý kèm nguồn đã chọn. (PhieuYeuCauNhapXuat)</tspan></text><path d="M790 194 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">9. Lưu các dòng mặt hàng và lượng đề nghị. (ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 279 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">10. Gửi thông báo đến bộ phận kho. (ThongBao)</tspan></text><path d="M790 364 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">11. Hiển thị thông báo tạo yêu cầu thành công.</tspan></text><path d="M790 449 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="470" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="494" font-size="16"><tspan x="58" dy="0">12. Kết thúc use case.</tspan></text><path d="M790 534 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="555" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="577" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="597" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="621" font-size="16"><tspan x="58" dy="0">3.1 Yêu cầu nhập nguyên vật liệu</tspan></text><path d="M110 661 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="682" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="706" font-size="16"><tspan x="58" dy="0">1. Chủ xưởng chọn Nhập kho, mục đích Nhập nguyên vật liệu từ kế hoạch mua. (KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan, MatHang, NguyenVatLieu)</tspan></text><path d="M110 766 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="787" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="811" font-size="16"><tspan x="58" dy="0">2. Chọn kế hoạch mua có đơn mua và phần hàng thực nhận phù hợp. (DonMuaHang,</tspan><tspan x="58" dy="20">ChiTietDonMuaHang, KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 871 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="892" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="916" font-size="16"><tspan x="58" dy="0">3. Hệ thống hiển thị lô nguyên vật liệu, phần đạt chất lượng còn chưa nhập và số lượng được</tspan><tspan x="58" dy="20">phép yêu cầu; phần lỗi hoặc đã trả nhà cung cấp không được tính vào lượng đạt. (LoHang,</tspan><tspan x="58" dy="20">ChiTietLo, MatHang, NguyenVatLieu, NhaCungCap, KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 1016 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>