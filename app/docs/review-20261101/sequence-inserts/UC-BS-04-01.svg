<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1021" viewBox="0 0 900 1021"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1021" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-BS-04 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Người dùng đã đăng nhập</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1011 M790 110 V1011" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Xóa dữ liệu cạnh Đăng xuất.</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị cảnh báo phạm vi dọn và ô xác nhận.</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Nhập chính xác XOA DU LIEU TEST rồi xác nhận.</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Kiểm tra môi trường, quyền đăng nhập và xác nhận; sao lưu, dọn dữ liệu luồng thử theo quy</tspan><tspan x="58" dy="20">trình, thông báo kết quả và yêu cầu đăng nhập lại.</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="532" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="554" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="574" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="598" font-size="16"><tspan x="58" dy="0">3.1 Hủy/đóng form: không xóa dữ liệu.</tspan></text><path d="M110 638 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="659" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="683" font-size="16"><tspan x="58" dy="0">3.2 Sau khi dọn, đăng nhập và tạo lại đơn từ đầu: danh mục và tài khoản còn dùng được.</tspan></text><path d="M110 723 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="744" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="766" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="786" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="810" font-size="16"><tspan x="58" dy="0">3.3 Chuỗi xác nhận khác, chưa đăng nhập hoặc yêu cầu xác nhận không hợp lệ: không xóa.</tspan></text><path d="M110 850 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="871" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="895" font-size="16"><tspan x="58" dy="0">3.4 Môi trường chính thức hoặc chưa bật công cụ: không hiện chức năng hoặc từ chối thực</tspan><tspan x="58" dy="20">hiện.</tspan></text><path d="M110 955 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>