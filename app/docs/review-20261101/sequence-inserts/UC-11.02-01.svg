<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1012" viewBox="0 0 900 1012"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1012" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-11.02 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1002 M790 110 V1002" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Xuất thành phẩm (MatHang, ThanhPham)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị các công việc xuất đúng mục đích được giao cho nhân viên, còn lượng chưa thực</tspan><tspan x="58" dy="20">hiện. (CongViec, PhanCongCongViec, PhanCongKho)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Chọn công việc và đối chiếu giấy tờ thực xuất; kiểm tra số lượng gợi ý, nhập lượng thực</tspan><tspan x="58" dy="20">xuất và ghi chú thực tế. (CongViec, PhanCongCongViec, PhanCongKho)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="190" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Hiển thị yêu cầu, đơn hàng, kế hoạch sản xuất, kế hoạch bán và các phần thành phẩm đạt</tspan><tspan x="58" dy="20">chất lượng mà Quản lý kho đã phân công. Kiểm tra điều kiện hoàn tất sản xuất, ngày giao và</tspan><tspan x="58" dy="20">lượng còn được giao. (PhieuYeuCauNhapXuat, ChiTietPhieuYeuCauNhapXuat, DonHang,</tspan><tspan x="58" dy="20">ChiTietDonHang, KeHoachSanXuat, ChiTietKeHoachSanXuat, KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="58" dy="20">LoHang, ChiTietLo, KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC, PhanCongKho) Nhân viên thực</tspan><tspan x="58" dy="20">hiện đúng phần được giao theo thứ tự Quản lý kho đã xác nhận; gợi ý điều phối ưu tiên hạn</tspan><tspan x="58" dy="20">dùng sớm, cùng hạn dùng thì thời điểm nhập kho sớm trước. Nhân viên không tự lấy lô khác</tspan><tspan x="58" dy="20">ngoài phân công. (PhanCongKho, ChiTietLo, PhieuKho, ChiTietPhieuKho, ViTriKho)</tspan></text><path d="M790 671 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="692" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="716" font-size="16"><tspan x="58" dy="0">5. Xác nhận xuất kho</tspan></text><path d="M110 756 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="777" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="801" font-size="16"><tspan x="58" dy="0">6. Kiểm tra lại tồn kho khả dụng và trạng thái lô (TonKho, LoHang, ChiTietLo, PhanCongKho)</tspan></text><path d="M790 841 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="862" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="886" font-size="16"><tspan x="58" dy="0">7. Lập phiếu xuất kho và trừ tồn kho (PhieuKho, ChiTietPhieuKho, TonKho, BienDongKho,</tspan><tspan x="58" dy="20">PhanCongKho)</tspan></text><path d="M790 946 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>