<svg xmlns="http://www.w3.org/2000/svg" width="900" height="999" viewBox="0 0 900 999"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="999" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-31 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V989 M790 110 V989" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Phê duyệt kế hoạch sản xuất. (KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách kế hoạch sản xuất đang chờ phê duyệt. (KeHoachSanXuat)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn kế hoạch sản xuất để xem chi tiết. (KeHoachSanXuat)</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Hiển thị đơn hàng, kế hoạch sản xuất và xưởng liên quan. (KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat, DonHang, ChiTietDonHang, MatHang, ThanhPham, NguyenVatLieu, Xuong)</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="532" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="556" font-size="16"><tspan x="58" dy="0">5. Chọn Phê duyệt kế hoạch sản xuất. (KeHoachSanXuat)</tspan></text><path d="M110 596 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="617" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="641" font-size="16"><tspan x="58" dy="0">6. Kiểm tra lại kế hoạch, ngày thực hiện và đơn hàng liên quan; lưu quyết định phê duyệt kế</tspan><tspan x="58" dy="20">hoạch, cập nhật trạng thái đơn hàng theo quyết định và thông báo cho Bộ phận lập kế hoạch,</tspan><tspan x="58" dy="20">Chủ xưởng phụ trách. (KeHoachSanXuat, DonHang, NguoiDungXuong, ThongBao)</tspan></text><path d="M790 721 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="742" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="764" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="784" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="808" font-size="16"><tspan x="58" dy="0">5.1 Từ chối kế hoạch sản xuất</tspan></text><path d="M110 848 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="869" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="893" font-size="16"><tspan x="58" dy="0">1. Ban giám đốc chọn Từ chối và nhập lý do.</tspan></text><path d="M110 933 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>