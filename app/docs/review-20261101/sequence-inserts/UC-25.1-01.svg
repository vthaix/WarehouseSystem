<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1104" viewBox="0 0 900 1104"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1104" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-25.1 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1094 M790 110 V1094" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Chỉnh sửa công việc (CongViec)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form với thông tin hiện tại của công việc (CongViec, PhanCongCongViec,</tspan><tspan x="58" dy="20">NguoiDung)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nhập thông tin muốn chỉnh sửa và chọn Xác nhận. (CongViec)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Hệ thống kiểm tra công việc còn được phép chỉnh sửa. (CongViec)</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="532" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="556" font-size="16"><tspan x="58" dy="0">5. Kiểm tra dữ liệu nhập (CongViec)</tspan></text><path d="M790 596 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="617" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="641" font-size="16"><tspan x="58" dy="0">6. Kiểm tra nhân viên được giao, người lập biên bản và phạm vi lô khi có thay đổi; với đợt</tspan><tspan x="58" dy="20">kiểm kê, chỉ chọn nhân viên QC/AC hoặc Ban kiểm kê. (CongViec, PhanCongCongViec, NguoiDung,</tspan><tspan x="58" dy="20">NguoiDungVaiTro, VaiTro, LoLichKiemTra, PhanCongLichKiemTra, LoHang, ChiTietLo)</tspan></text><path d="M790 721 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="742" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="766" font-size="16"><tspan x="58" dy="0">7. Lưu thông tin công việc được cập nhật vào hệ thống và thông báo cập nhật thành công</tspan><tspan x="58" dy="20">(CongViec, PhanCongCongViec, LoLichKiemTra, PhanCongLichKiemTra, ThongBao)</tspan></text><path d="M790 826 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="847" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="869" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="889" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="913" font-size="16"><tspan x="58" dy="0">4.1 Nếu giám đốc chọn Huỷ</tspan></text><path d="M110 953 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="974" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="998" font-size="16"><tspan x="58" dy="0">1. Hệ thống hủy thông tin đã chỉnh sửa</tspan></text><path d="M790 1038 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>