<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1024" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-03 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Khách hàng; Ban giám đốc được xem đơn hàng …</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1014 M790 110 V1014" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Quản lý đơn hàng (DonHang)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách đơn hàng hiện có của khách hàng (DonHang, KhachHang)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn một đơn hàng để xem chi tiết (DonHang)</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Hiển thị thông tin chi tiết đơn hàng (DonHang, ChiTietDonHang, MatHang, ThanhPham)</tspan></text><path d="M790 491 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="512" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="534" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="554" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="578" font-size="16"><tspan x="58" dy="0">1.1 Tìm kiếm/lọc đơn hàng theo trạng thái, thời gian</tspan></text><path d="M110 618 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="639" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="663" font-size="16"><tspan x="58" dy="0">1. Khách hàng nhập điều kiện tìm kiếm</tspan></text><path d="M110 703 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="724" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="748" font-size="16"><tspan x="58" dy="0">2. Hệ thống hiển thị các đơn hàng phù hợp (DonHang, ChiTietDonHang)</tspan></text><path d="M790 788 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="809" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="833" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 873 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="894" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="918" font-size="16"><tspan x="58" dy="0">4.1 Chọn Sửa đơn hàng</tspan></text><path d="M110 958 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>