<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1034" viewBox="0 0 900 1034"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1034" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-16 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1024 M790 110 V1024" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Xử lý chênh lệch kiểm kê (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Tự hiển thị các ngoại lệ từ biên bản đã gửi và các chênh lệch cần xử lý; không yêu cầu</tspan><tspan x="58" dy="20">Quản lý kho tự tạo lại vấn đề đã có. (PhieuKiemKe, ChiTietPhieuKiemKe, LoLichKiemTra,</tspan><tspan x="58" dy="20">BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Chọn vấn đề cần xử lý. (PhieuKiemKe, LoLichKiemTra, BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Hiển thị biên bản, kết quả số lượng hoặc chất lượng, mặt hàng, lô, lượng liên quan và mô</tspan><tspan x="58" dy="20">tả ngoại lệ; mở form xử lý. (PhieuKiemKe, ChiTietPhieuKiemKe, KetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo, MatHang, NguyenVatLieu, ThanhPham,</tspan><tspan x="58" dy="20">BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 591 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="612" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="636" font-size="16"><tspan x="58" dy="0">5. Nhập cách xử lý; nếu cần xin ý kiến, chọn gửi đề xuất cho Chủ xưởng và nhập nội dung đề</tspan><tspan x="58" dy="20">nghị. (PhieuKiemKe, LoLichKiemTra, BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 696 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="717" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="741" font-size="16"><tspan x="58" dy="0">6. Xác nhận nội dung xử lý.</tspan></text><path d="M110 781 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="802" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="826" font-size="16"><tspan x="58" dy="0">7. Lưu cách xử lý hoặc gửi đề xuất chờ Chủ xưởng phê duyệt. Vấn đề đơn giản có thể xác nhận</tspan><tspan x="58" dy="20">xử lý trực tiếp bằng mô tả; nếu cần điều chỉnh tồn kho, phải thực hiện bước chứng từ và phê</tspan><tspan x="58" dy="20">duyệt tương ứng, không chỉ sửa số tồn bằng ghi chú. (PhieuKiemKe, LoLichKiemTra,</tspan><tspan x="58" dy="20">BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M790 926 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="947" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="969" font-size="16" font-weight="bold">Luồng thay thế</text></svg>