<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1074" viewBox="0 0 900 1074"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1074" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-35 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1064 M790 110 V1064" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Báo cáo thành phẩm (MatHang, ThanhPham)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị kế hoạch, xưởng, số lượng thành phẩm theo kế hoạch, đã báo cáo, còn lại và</tspan><tspan x="58" dy="20">nguyên vật liệu đã xuất cho sản xuất. (KeHoachSanXuat, ChiTietKeHoachSanXuat, Xuong,</tspan><tspan x="58" dy="20">BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, PhieuKho, ChiTietPhieuKho, MatHang, ThanhPham,</tspan><tspan x="58" dy="20">NguyenVatLieu)</tspan></text><path d="M790 381 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="402" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="426" font-size="16"><tspan x="58" dy="0">3. Nhập lượng thành phẩm mới hoàn thành của phần này, thông tin phần lô, ngày sản xuất, hạn</tspan><tspan x="58" dy="20">dùng nếu có và ghi chú. Khi báo cáo đợt cuối, kiểm tra và nhập lượng nguyên vật liệu thực tế</tspan><tspan x="58" dy="20">đã dùng. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat, LoHang, ChiTietLo)</tspan></text><path d="M110 506 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="527" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="551" font-size="16"><tspan x="58" dy="0">4. Cập nhật lượng còn lại theo lượng đang nhập; kiểm tra tổng các phần thành phẩm, lô, ngày</tspan><tspan x="58" dy="20">và lượng nguyên vật liệu sử dụng. Các phần của cùng kế hoạch dùng chung mã lô sản xuất nhưng</tspan><tspan x="58" dy="20">có thông tin phần riêng. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat,</tspan><tspan x="58" dy="20">LoHang, ChiTietLo, KeHoachSanXuat, ChiTietKeHoachSanXuat, PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 651 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="672" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="696" font-size="16"><tspan x="58" dy="0">5. Xác nhận gửi báo cáo</tspan></text><path d="M110 736 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="757" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="781" font-size="16"><tspan x="58" dy="0">6. Lưu và gửi báo cáo thành phẩm; ghi nhận phần lô tương ứng, thông báo cho người nhận. Chỉ</tspan><tspan x="58" dy="20">đợt cuối đủ điều kiện mới hoàn tất kế hoạch; không tự nhập tồn hoặc tự kết luận chất lượng.</tspan><tspan x="58" dy="20">(BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, ChiTietLoBaoCaoSanXuat, LoHang, ChiTietLo,</tspan><tspan x="58" dy="20">KeHoachSanXuat, ThongBao)</tspan></text><path d="M790 881 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="902" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="924" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="944" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="968" font-size="16"><tspan x="58" dy="0">5.1 Hủy trước khi xác nhận gửi báo cáo</tspan></text><path d="M110 1008 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>