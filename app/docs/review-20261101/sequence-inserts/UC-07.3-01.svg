<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1039" viewBox="0 0 900 1039"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1039" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-07.3 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1029 M790 110 V1029" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Sửa (MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hệ thống mở form nhập cho phép chỉnh sửa các thông tin được phép chỉnh sửa (MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Chỉnh sửa các thông tin được phép của dữ liệu đang chọn, như tên mặt hàng, danh mục, đơn</tspan><tspan x="58" dy="20">vị tính, giá, ảnh hoặc mô tả, rồi xác nhận. (MatHang, NguyenVatLieu, ThanhPham, LoaiHang,</tspan><tspan x="58" dy="20">DonViTinh)</tspan></text><path d="M110 466 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="487" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="511" font-size="16"><tspan x="58" dy="0">4. Hệ thống kiểm tra thông tin vừa được nhập (MatHang, NguyenVatLieu, ThanhPham, LoaiHang,</tspan><tspan x="58" dy="20">DonViTinh)</tspan></text><path d="M790 571 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="592" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="616" font-size="16"><tspan x="58" dy="0">5. Hệ thống lưu thông tin mới và thông báo chỉnh sửa thành công. (MatHang, NguyenVatLieu,</tspan><tspan x="58" dy="20">ThanhPham)</tspan></text><path d="M790 676 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="697" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="719" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="739" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="763" font-size="16"><tspan x="58" dy="0">3.1 Hủy trước khi xác nhận</tspan></text><path d="M110 803 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="824" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="848" font-size="16"><tspan x="58" dy="0">1. Quản lý kho chọn Hủy</tspan></text><path d="M110 888 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="909" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="933" font-size="16"><tspan x="58" dy="0">2. Hệ thống hủy thông tin đã chỉnh sửa</tspan></text><path d="M790 973 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>