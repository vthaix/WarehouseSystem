<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1102" viewBox="0 0 900 1102"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1102" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-12 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1092 M790 110 V1092" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-12.1</tspan></text><path d="M790 194 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">4.1 Chọn Sửa</tspan></text><path d="M110 279 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-12.2</tspan></text><path d="M790 364 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">4.2 Xem kết quả đã ghi nhận</tspan></text><path d="M110 449 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="470" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="494" font-size="16"><tspan x="58" dy="0">1. Kết quả đã ghi không được xóa; nếu sai, thực hiện điều chỉnh tại UC-12.2 để giữ lịch sử.</tspan><tspan x="58" dy="20">UC-12.3 không còn được sử dụng để xóa kết quả. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 554 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="575" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="599" font-size="16"><tspan x="58" dy="0">4.3 Kết quả ghi nhận &quot;không đạt&quot;</tspan></text><path d="M110 639 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="660" width="810" height="130" fill="white" stroke="#cad7ce"/><text x="58" y="684" font-size="16"><tspan x="58" dy="0">1. Hệ thống lưu kết quả không đạt và ghi nhận trạng thái để tiếp tục xử lý hàng lỗi</tspan><tspan x="58" dy="20">(KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC) Chứng từ còn cần xử lý được làm nổi bật và</tspan><tspan x="58" dy="20">hiển thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo</tspan><tspan x="58" dy="20">không kết thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn</tspan><tspan x="58" dy="20">hợp lệ. (ThongBao, CongViec)</tspan></text><path d="M790 804 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="825" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="847" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="867" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="891" font-size="16"><tspan x="58" dy="0">1.1 Không có kết quả phù hợp</tspan></text><path d="M110 931 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="952" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="976" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không tìm thấy kết quả phù hợp (KetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 1036 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>