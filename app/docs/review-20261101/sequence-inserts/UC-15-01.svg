<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1034" viewBox="0 0 900 1034"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1034" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-15 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban kiểm kê</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1024 M790 110 V1024" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Thực hiện kiểm kê</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị các công việc được giao; khi chọn công việc, hiển thị toàn bộ lô hoặc phần lô</tspan><tspan x="58" dy="20">phải kiểm cùng mặt hàng, đơn vị và lượng hệ thống để đối chiếu. (CongViec, PhanCongCongViec,</tspan><tspan x="58" dy="20">LoLichKiemTra, PhanCongLichKiemTra, LoHang, ChiTietLo, MatHang, DonViTinh, PhieuKiemKe,</tspan><tspan x="58" dy="20">ChiTietPhieuKiemKe, TonKho)</tspan></text><path d="M790 381 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="402" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="426" font-size="16"><tspan x="58" dy="0">3. Chọn công việc và nhập lượng thực đếm của từng dòng; có thể chọn Đạt ở một dòng hoặc Đạt</tspan><tspan x="58" dy="20">tất cả để điền lượng bằng lượng hệ thống. (PhieuKiemKe, ChiTietPhieuKiemKe,</tspan><tspan x="58" dy="20">PhanCongLichKiemTra)</tspan></text><path d="M110 506 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="527" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="551" font-size="16"><tspan x="58" dy="0">4. Hiển thị chênh lệch theo số lượng vừa nhập; vẫn cho sửa lượng đã điền để đúng thực tế.</tspan><tspan x="58" dy="20">Nút Đạt chỉ hỗ trợ kiểm số lượng, không thay kết luận chất lượng của QC/AC. (PhieuKiemKe,</tspan><tspan x="58" dy="20">ChiTietPhieuKiemKe)</tspan></text><path d="M790 631 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="652" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="676" font-size="16"><tspan x="58" dy="0">5. Xác nhận lưu kết quả kiểm số lượng của công việc.</tspan></text><path d="M110 716 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="737" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="761" font-size="16"><tspan x="58" dy="0">6. Kiểm tra đủ dòng và quyền phân công; lưu số đếm, người đếm, thời điểm và tiến độ. Nếu đợt</tspan><tspan x="58" dy="20">có QC/AC, vẫn chờ phần chất lượng hoàn tất. Không tự điều chỉnh tồn kho theo số đếm.</tspan><tspan x="58" dy="20">(PhieuKiemKe, ChiTietPhieuKiemKe, CongViec, LoLichKiemTra, PhanCongLichKiemTra)</tspan></text><path d="M790 841 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="862" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="884" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="904" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="928" font-size="16"><tspan x="58" dy="0">3.1 Điền nhanh số lượng đạt</tspan></text><path d="M110 968 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>