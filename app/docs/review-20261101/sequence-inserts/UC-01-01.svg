<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1044" viewBox="0 0 900 1044"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1044" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-01 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Người dùng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1034 M790 110 V1034" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Truy cập màn hình đăng nhập</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form đăng nhập gồm tên đăng nhập và mật khẩu</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Nhập tên đăng nhập, mật khẩu và chọn Đăng nhập</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Kiểm tra thông tin đăng nhập (NguoiDung, NguoiDungVaiTro, VaiTro, LanThuDangNhap)</tspan></text><path d