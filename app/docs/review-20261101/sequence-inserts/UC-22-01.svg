<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1034" viewBox="0 0 900 1034"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1034" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-22 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho, Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1024 M790 110 V1024" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Tra cứu dữ liệu (Kho, ViTriKho, TonKho, LoHang, ChiTietLo, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, ThanhPham)</tspan></text><path d="M110 256 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="277" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="301" font-size="16"><tspan x="58" dy="0">2. Hiển thị xưởng, kho và sơ đồ vị trí. Mỗi xưởng có kho nguyên vật liệu, kho thành phẩm và</tspan><tspan x="58" dy="20">kho hàng trả về; danh sách kho đổi theo xưởng được chọn. (Xuong, Kho, ViTriKho)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Chọn xưởng, một trong ba kho, khu lưu trữ; có thể lọc nhóm hàng, danh mục hoặc tìm theo</tspan><tspan x="58" dy="20">tên mặt hàng, mã mặt hàng, mã lô. (Xuong, Kho, ViTriKho, LoaiHang, MatHang, NguyenVatLieu,</tspan><tspan x="58" dy="20">ThanhPham, LoHang, ChiTietLo)</tspan></text><path d="M110 486 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="507" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="531" font-size="16"><tspan x="58" dy="0">4. Hiển thị các khu có tên theo nhóm hàng, như Khu bột, Khu đường muối, Khu bao bì; phân</tspan><tspan x="58" dy="20">biệt vị trí có hàng, trống và đang chọn. Có thể xem một khu hoặc tất cả khu. (Kho, ViTriKho,</tspan><tspan x="58" dy="20">LoaiHang, MatHang, LoHang, ChiTietLo, TonKho)</tspan></text><path d="M790 611 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="632" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="656" font-size="16"><tspan x="58" dy="0">5. Chọn vị trí để xem chi tiết hàng đang lưu. (Kho, ViTriKho, TonKho, ChiTietLo)</tspan></text><path d="M110 696 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="717" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="741" font-size="16"><tspan x="58" dy="0">6. Hiển thị thông tin chi tiết (Kho, ViTriKho, MatHang, NguyenVatLieu, ThanhPham, DonViTinh,</tspan><tspan x="58" dy="20">LoHang, ChiTietLo, TonKho, PhanCongKho) Tra cứu chỉ đọc dữ liệu; gợi ý vị trí khi nhập và</tspan><tspan x="58" dy="20">thứ tự lô khi xuất được thực hiện tại UC-08 và UC-09, không tự chuyển hàng khi xem sơ đồ.</tspan><tspan x="58" dy="20">(Kho, ViTriKho, TonKho, PhanCongKho)</tspan></text><path d="M790 841 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="862" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="884" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="904" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="928" font-size="16"><tspan x="58" dy="0">5.1 Chỉ xem danh sách, không xem chi tiết</tspan></text><path d="M110 968 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>