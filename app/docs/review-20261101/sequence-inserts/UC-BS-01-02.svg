<svg xmlns="http://www.w3.org/2000/svg" width="900" height="575" viewBox="0 0 900 575"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="575" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-BS-01 — Sequence · Tiếp nối 2/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản trị viên</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V565 M790 110 V565" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">4.1 Thiếu tên, mật khẩu dưới 6 hoặc trên 128 ký tự, email sai, vai trò rỗng/trùng/không tồn</tspan><tspan x="58" dy="20">tại, xưởng không hợp lệ: không lưu, chỉ rõ trường cần sửa.</tspan></text><path d="M110 214 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">4.2 Tên đăng nhập dưới 3/trên 80 ký tự, ký tự không hợp lệ hoặc trùng: không tạo.</tspan></text><path d="M110 299 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="320" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="344" font-size="16"><tspan x="58" dy="0">4.3 Tự khóa, tự gỡ quyền quản trị hoặc làm mất quản trị viên hoạt động cuối cùng: từ chối;</tspan><tspan x="58" dy="20">giữ tài khoản quản trị đang hoạt động.</tspan></text><path d="M110 404 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="425" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="449" font-size="16"><tspan x="58" dy="0">4.4 Người không có quyền quản trị hoặc dữ liệu vừa thay đổi: không cho sửa, không lộ thông</tspan><tspan x="58" dy="20">tin trái quyền.</tspan></text><path d="M110 509 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>