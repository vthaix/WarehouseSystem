<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1039" viewBox="0 0 900 1039"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1039" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-05 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1029 M790 110 V1029" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Quản lý kế hoạch</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị các kế hoạch của chức năng đang chọn cùng trạng thái và nguồn liên quan.</tspan><tspan x="58" dy="20">(KeHoachMuaBan, KeHoachSanXuat)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Chọn một kế hoạch để xem chi tiết (KeHoachMuaBan, KeHoachSanXuat)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Hiển thị kế hoạch và các dòng chi tiết; kế hoạch sản xuất có đơn hàng, xưởng và nguyên</tspan><tspan x="58" dy="20">vật liệu; kế hoạch mua hoặc bán có báo cáo nguồn nếu được lập từ báo cáo. (KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan, KeHoachSanXuat, ChiTietKeHoachSanXuat, DonHang, ChiTietDonHang, Xuong,</tspan><tspan x="58" dy="20">BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang, NguyenVatLieu, ThanhPham)</tspan></text><path d="M790 571 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="592" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="614" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="634" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="658" font-size="16"><tspan x="58" dy="0">3.1 Tìm kiếm/lọc kế hoạch</tspan></text><path d="M110 698 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="719" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="743" font-size="16"><tspan x="58" dy="0">1. Nhân viên nhập điều kiện tìm kiếm (loại kế hoạch, thời gian, trạng thái)</tspan></text><path d="M110 783 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="804" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="828" font-size="16"><tspan x="58" dy="0">2. Hệ thống hiển thị các kế hoạch phù hợp (KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="58" dy="20">KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M790 888 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="909" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="933" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 1</tspan></text><path d="M110 973 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>