<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1061" viewBox="0 0 900 1061"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1061" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-02 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Khách hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1051 M790 110 V1051" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Đặt đơn hàng (DonHang)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách hàng mẫu để lựa chọn (MatHang, ThanhPham, LoaiHang, DonViTinh)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn một hoặc nhiều mặt hàng, nhập số lượng theo đơn vị hiển thị, ghi chú từng dòng nếu</tspan><tspan x="58" dy="20">có; nhập địa chỉ, ngày nhận trễ nhất và ghi chú chung. (MatHang, ThanhPham, DonViTinh)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Xác nhận đặt hàng</tspan></text><path d="M110 511 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="532" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="556" font-size="16"><tspan x="58" dy="0">5. Kiểm tra hàng còn được đặt, các mặt hàng không trùng, số lượng dương, địa chỉ và ngày</tspan><tspan x="58" dy="20">nhận; lấy giá hiện hành của mặt hàng để tính tiền tham khảo. (MatHang, ThanhPham, KhachHang)</tspan></text><path d="M790 616 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="637" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="661" font-size="16"><tspan x="58" dy="0">6. Lưu một đơn hàng với các dòng đã chọn, trạng thái Chờ tiếp nhận; thông báo đặt thành công</tspan><tspan x="58" dy="20">và gửi thông báo cho Bộ phận lập kế hoạch. Đặt hàng chưa tạo lô hàng vật lý. (DonHang,</tspan><tspan x="58" dy="20">ChiTietDonHang, KhachHang, ThongBao)</tspan></text><path d="M790 741 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="762" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="784" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="804" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="828" font-size="16"><tspan x="58" dy="0">4.1 Khách hàng chọn Quay lại</tspan></text><path d="M110 868 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="889" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="913" font-size="16"><tspan x="58" dy="0">1. Quay lại bước 2</tspan></text><path d="M110 953 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="974" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="996" font-size="16" font-weight="bold">Luồng ngoại lệ</text></svg>