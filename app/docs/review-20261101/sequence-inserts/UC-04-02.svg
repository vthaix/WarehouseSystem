<svg xmlns="http://www.w3.org/2000/svg" width="900" height="967" viewBox="0 0 900 967"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="967" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-04 — Sequence · Tiếp nối 2/5</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V957 M790 110 V957" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">3.1 Chọn kế hoạch bán hàng</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">1. Chọn báo cáo thành phẩm đã gửi phù hợp; lấy thành phẩm thực tế, đối chiếu phần đạt chất</tspan><tspan x="58" dy="20">lượng đã nhập kho và lượng còn có thể sử dụng, nhập lượng bán và ghi chú. (BanBaoCaoSanXuat,</tspan><tspan x="58" dy="20">ChiTietBaoCaoSanXuat, TonKho, PhanCongKho, MatHang, ThanhPham, KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan)</tspan></text><path d="M110 381 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="402" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="426" font-size="16"><tspan x="58" dy="0">2. Kiểm tra và tính tổng tiền như bước 5 đến bước 6; khi xác nhận, lưu kế hoạch bán và các</tspan><tspan x="58" dy="20">dòng, gắn với báo cáo thành phẩm nguồn, trạng thái Chờ phê duyệt. (KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang, ThanhPham)</tspan></text><path d="M790 506 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="527" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="551" font-size="16"><tspan x="58" dy="0">3.2 Chọn kế hoạch sản xuất</tspan></text><path d="M110 591 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="612" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="636" font-size="16"><tspan x="58" dy="0">1. Bộ phận lập kế hoạch chọn đơn hàng cần sản xuất; hệ thống lấy thông tin từ đơn hàng gồm</tspan><tspan x="58" dy="20">thành phẩm, số lượng và ngày giao dự kiến (DonHang, MatHang, ThanhPham, KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan)</tspan></text><path d="M110 716 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="737" width="810" height="150" fill="white" stroke="#cad7ce"/><text x="58" y="761" font-size="16"><tspan x="58" dy="0">2. Chọn xưởng, ngày bắt đầu, ngày kết thúc và ghi chú; hệ thống tính nguyên vật liệu dự kiến</tspan><tspan x="58" dy="20">từ công thức và số lượng thành phẩm, cộng dự phòng 10% một lần cho từng loại. Đối chiếu</tspan><tspan x="58" dy="20">lượng có thể cấp để hiển thị phần thiếu dự kiến; kế hoạch có cả danh sách thành phẩm và</tspan><tspan x="58" dy="20">nguyên vật liệu. (KeHoachSanXuat, ChiTietKeHoachSanXuat, TonKho, PhanCongKho, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, ThanhPham, Xuong, DotKiemKe, CongViec, LoLichKiemTra, KeHoachMuaBan,</tspan><tspan x="58" dy="20">ChiTietKeHoachMuaBan)</tspan></text><path d="M110 901 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>