<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1037" viewBox="0 0 900 1037"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1037" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-34 — Sequence · Tiếp nối 1/5</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1027 M790 110 V1027" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Lập phiếu báo cáo sản xuất. (BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form báo cáo sản xuất. (KeHoachSanXuat, Xuong)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn kế hoạch sản xuất và mục đích báo cáo: tiến độ, sự cố hoặc nhu cầu nguyên vật liệu.</tspan><tspan x="58" dy="20">(KeHoachSanXuat)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Hiển thị kế hoạch, xưởng và các nội dung phù hợp với mục đích báo cáo. Với báo cáo nhu</tspan><tspan x="58" dy="20">cầu, lấy lượng nguyên vật liệu ước lượng từ kế hoạch. (KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat, Xuong, MatHang, NguyenVatLieu)</tspan></text><path d="M790 551 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="572" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="596" font-size="16"><tspan x="58" dy="0">5. Với báo cáo nhu cầu, hiển thị lượng tồn khả dụng từ hệ thống; không coi toàn bộ lượng đã</tspan><tspan x="58" dy="20">dành cho nhu cầu khác là lượng còn có thể cấp. (TonKho, PhanCongKho, ChiTietLo, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu)</tspan></text><path d="M790 676 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="697" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="721" font-size="16"><tspan x="58" dy="0">6. Nhập tiến độ sản xuất hiện tại. (BanBaoCaoSanXuat)</tspan></text><path d="M110 761 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="782" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="806" font-size="16"><tspan x="58" dy="0">7. Nhập mô tả tình hình sản xuất, vấn đề phát sinh hoặc nội dung cần báo cáo.</tspan><tspan x="58" dy="20">(BanBaoCaoSanXuat)</tspan></text><path d="M110 866 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="887" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="911" font-size="16"><tspan x="58" dy="0">8. Với báo cáo nhu cầu, đối chiếu lượng có thể cấp với lượng ước lượng cần dùng.</tspan><tspan x="58" dy="20">(KeHoachSanXuat, ChiTietKeHoachSanXuat, TonKho, PhanCongKho, MatHang, NguyenVatLieu)</tspan></text><path d="M790 971 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>