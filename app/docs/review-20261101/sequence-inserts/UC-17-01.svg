<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1039" viewBox="0 0 900 1039"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1039" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-17 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1029 M790 110 V1029" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Phê duyệt đề xuất xử lý ngoại lệ (BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách đề xuất đang chờ phê duyệt (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn một đề xuất để xem chi tiết (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Hiển thị thông tin chi tiết đề xuất, loại hàng, số lượng, hàng bị vấn đề gì</tspan><tspan x="58" dy="20">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, PhieuKiemKe, ChiTietPhieuKiemKe,</tspan><tspan x="58" dy="20">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo, MatHang, NguyenVatLieu,</tspan><tspan x="58" dy="20">ThanhPham, LoaiHang)</tspan></text><path d="M790 551 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="572" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="596" font-size="16"><tspan x="58" dy="0">5. Chọn Phê duyệt (BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 636 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="657" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="681" font-size="16"><tspan x="58" dy="0">6. Lưu quyết định phê duyệt và thông báo cho Quản lý kho. Việc phê duyệt không tự thay đổi</tspan><tspan x="58" dy="20">số lượng tồn kho; Quản lý kho thực hiện phương án được chấp thuận ở bước xử lý riêng.</tspan><tspan x="58" dy="20">(BanDeXuatXuLyNgoaiLe, KetQuaXuLyNgoaiLe, ThongBao)</tspan></text><path d="M790 761 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="782" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="804" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="824" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="848" font-size="16"><tspan x="58" dy="0">5.1 Không đồng ý phương án đề xuất</tspan></text><path d="M110 888 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="909" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="933" font-size="16"><tspan x="58" dy="0">1. Chủ xưởng chọn Không đồng ý, nhập lý do và hướng xử lý theo ý kiến của chủ xưởng.</tspan></text><path d="M110 973 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>