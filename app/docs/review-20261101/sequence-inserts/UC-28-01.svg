<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1014" viewBox="0 0 900 1014"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1014" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-28 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban kiểm kê, bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1004 M790 110 V1004" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Lập biên bản kiểm kê (PhieuKiemKe, LoLichKiemTra)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị công việc và kết quả đã hoàn tất. Đợt có cả QC/AC và Ban kiểm kê tổng hợp cả</tspan><tspan x="58" dy="20">chất lượng và số đếm; đợt chỉ có một nhóm chỉ yêu cầu kết quả của nhóm được giao. (CongViec,</tspan><tspan x="58" dy="20">PhanCongCongViec, LoLichKiemTra, PhanCongLichKiemTra, PhieuKiemKe, ChiTietPhieuKiemKe,</tspan><tspan x="58" dy="20">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 381 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="402" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="426" font-size="16"><tspan x="58" dy="0">3. Người được chỉ định nhập kết luận, nhận xét; chọn Không có ngoại lệ hoặc Nhập mô tả ngoại</tspan><tspan x="58" dy="20">lệ; nếu có ngoại lệ thì nhập nội dung, xem lại và gửi biên bản. (PhieuKiemKe, LoLichKiemTra)</tspan></text><path d="M110 486 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="507" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="531" font-size="16"><tspan x="58" dy="0">4. Kiểm tra người lập và kết quả đợt; lưu biên bản chung, nội dung ngoại lệ nếu có và gửi</tspan><tspan x="58" dy="20">thông báo. Biên bản đã gửi giữ nguyên kết quả được tổng hợp tại thời điểm gửi. (PhieuKiemKe,</tspan><tspan x="58" dy="20">LoLichKiemTra, PhanCongLichKiemTra, PhanCongKetLuanKiemKe, KetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietKetQuaKiemTraQCAC, ChiTietPhieuKiemKe, ThongBao)</tspan></text><path d="M790 631 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="652" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="674" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="694" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="718" font-size="16"><tspan x="58" dy="0">3.1 Lưu tạm biên bản</tspan></text><path d="M110 758 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="779" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="803" font-size="16"><tspan x="58" dy="0">1. Nhân viên chọn Lưu tạm (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 843 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="864" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="888" font-size="16"><tspan x="58" dy="0">2. Lưu tạm nội dung biên bản trên phiếu kiểm kê. (PhieuKiemKe, LoLichKiemTra,</tspan><tspan x="58" dy="20">ChiTietPhieuKiemKe)</tspan></text><path d="M790 948 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>