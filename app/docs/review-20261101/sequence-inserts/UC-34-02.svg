<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1035" viewBox="0 0 900 1035"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1035" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-34 — Sequence · Tiếp nối 2/5</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1025 M790 110 V1025" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">9. Tính lượng thiếu của từng nguyên vật liệu, không nhỏ hơn 0; xác định đủ hoặc thiếu. Báo</tspan><tspan x="58" dy="20">cáo tiến độ hoặc sự cố không bắt buộc phải có dòng nguyên vật liệu. (ChiTietKeHoachSanXuat,</tspan><tspan x="58" dy="20">TonKho, PhanCongKho, MatHang, NguyenVatLieu)</tspan></text><path d="M790 234 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="255" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="279" font-size="16"><tspan x="58" dy="0">10. Hiển thị nội dung báo cáo và người nhận mặc định là Ban giám đốc. (BanBaoCaoSanXuat,</tspan><tspan x="58" dy="20">NguoiDung, NguoiDungVaiTro, VaiTro)</tspan></text><path d="M790 339 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="360" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="384" font-size="16"><tspan x="58" dy="0">11. Chọn gửi thêm Bộ phận lập kế hoạch nếu cần. Với báo cáo nhu cầu còn thiếu nguyên vật</tspan><tspan x="58" dy="20">liệu, hệ thống tự gửi thêm bộ phận này. (BanBaoCaoSanXuat, NguoiDung, NguoiDungVaiTro,</tspan><tspan x="58" dy="20">VaiTro)</tspan></text><path d="M110 464 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="485" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="509" font-size="16"><tspan x="58" dy="0">12. Xác nhận gửi báo cáo.</tspan></text><path d="M110 549 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="570" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="594" font-size="16"><tspan x="58" dy="0">13. Kiểm tra thông tin báo cáo, tiến độ và quyền đối với kế hoạch, xưởng. (KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat, NguoiDungXuong, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 654 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="675" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="699" font-size="16"><tspan x="58" dy="0">14. Lưu báo cáo sản xuất với thời gian lập, mục đích, tiến độ và mô tả, liên kết kế hoạch</tspan><tspan x="58" dy="20">sản xuất và xưởng. (BanBaoCaoSanXuat)</tspan></text><path d="M790 759 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="780" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="804" font-size="16"><tspan x="58" dy="0">15. Đối với báo cáo nhu cầu, lưu từng nguyên vật liệu, lượng có thể cấp, lượng cần dùng và</tspan><tspan x="58" dy="20">lượng còn thiếu. (ChiTietBaoCaoSanXuat)</tspan></text><path d="M790 864 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="885" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="909" font-size="16"><tspan x="58" dy="0">16. Gửi báo cáo đến Ban giám đốc. (BanBaoCaoSanXuat, ThongBao, NguoiDung, NguoiDungVaiTro,</tspan><tspan x="58" dy="20">VaiTro)</tspan></text><path d="M790 969 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>