<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1052" viewBox="0 0 900 1052"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1052" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-05 — Sequence · Tiếp nối 2/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận lập kế hoạch</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1042 M790 110 V1042" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">4.1 Chọn Sửa</tspan></text><path d="M110 194 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-05.1</tspan></text><path d="M790 279 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">4.2 Chọn Xóa</tspan></text><path d="M110 364 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-05.2 Chứng từ còn cần xử lý được làm nổi bật và hiển thị số lượng</tspan><tspan x="58" dy="20">chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không kết thúc phần</tspan><tspan x="58" dy="20">việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp lệ. (ThongBao,</tspan><tspan x="58" dy="20">CongViec)</tspan></text><path d="M790 509 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="530" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="552" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="572" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="596" font-size="16"><tspan x="58" dy="0">2.1 Không có kế hoạch nào</tspan></text><path d="M110 636 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="657" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="681" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không tìm thấy kế hoạch (KeHoachMuaBan, ChiTietKeHoachMuaBan,</tspan><tspan x="58" dy="20">KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M790 741 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="762" width="810" height="210" fill="white" stroke="#cad7ce"/><text x="58" y="786" font-size="16"><tspan x="58" dy="0">2. Quay lại bước 13.2 Nếu phiên đăng nhập hết hạn hoặc người dùng không có quyền thao tác1.</tspan><tspan x="58" dy="20">Hệ thống yêu cầu đăng nhập lại hoặc thông báo không có quyền. (NguoiDung, NguoiDungVaiTro,</tspan><tspan x="58" dy="20">VaiTro, PhienDangNhap)2. Không thực hiện thay đổi chưa được cho phép.3.3 Nếu dữ liệu vừa bị</tspan><tspan x="58" dy="20">người khác thay đổi hoặc không còn tồn tại1. Hệ thống thông báo và không lưu đè thông tin</tspan><tspan x="58" dy="20">cũ. (KeHoachMuaBan, ChiTietKeHoachMuaBan, KeHoachSanXuat, ChiTietKeHoachSanXuat)2. Người</tspan><tspan x="58" dy="20">dùng tải lại danh sách hoặc chi tiết trước khi thực hiện lại.3.4 Nếu không kết nối được khi</tspan><tspan x="58" dy="20">xác nhận1. Hệ thống thông báo thao tác chưa có kết quả xác định.2. Khi kết nối trở lại,</tspan><tspan x="58" dy="20">người dùng kiểm tra danh sách hoặc chi tiết để biết lần trước đã được ghi nhận chưa rồi mới</tspan><tspan x="58" dy="20">thử lại; không mặc định bấm lại là tạo chứng từ mới.</tspan></text><path d="M110 986 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>