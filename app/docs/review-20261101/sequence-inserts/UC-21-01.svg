<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1021" viewBox="0 0 900 1021"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1021" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-21 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1011 M790 110 V1011" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Xem báo cáo kiểm kê</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form điều kiện lọc báo cáo (đợt kiểm kê, thời gian, khu vực) (DotKiemKe,</tspan><tspan x="58" dy="20">CongViec, PhieuKiemKe, Kho)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Chọn điều kiện lọc và xác nhận (DotKiemKe, PhieuKiemKe, Kho)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Tổng hợp và hiển thị báo cáo kiểm kê tương ứng (bao gồm số liệu chênh lệch) (PhieuKiemKe,</tspan><tspan x="58" dy="20">ChiTietPhieuKiemKe, DotKiemKe, Kho, MatHang, KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 531 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="552" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="574" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="594" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="618" font-size="16"><tspan x="58" dy="0">2.1 Xuất báo cáo ra file</tspan></text><path d="M110 658 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="679" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="703" font-size="16"><tspan x="58" dy="0">1. Ban giám đốc chọn Xuất file (PhieuKiemKe, ChiTietPhieuKiemKe)</tspan></text><path d="M110 743 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="764" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="788" font-size="16"><tspan x="58" dy="0">2. Hệ thống tạo và tải về file báo cáo</tspan></text><path d="M790 828 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="849" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="873" font-size="16"><tspan x="58" dy="0">3. Quay lại bước 2</tspan></text><path d="M110 913 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="934" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="956" font-size="16" font-weight="bold">Luồng ngoại lệ</text></svg>