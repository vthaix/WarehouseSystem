<svg xmlns="http://www.w3.org/2000/svg" width="900" height="994" viewBox="0 0 900 994"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="994" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-12.1 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V984 M790 110 V984" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Thêm kết quả kiểm tra (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị các đợt được phân công và từng phần lô còn chờ kiểm tra; gợi ý lượng cần kiểm.</tspan><tspan x="58" dy="20">(LoLichKiemTra, PhanCongLichKiemTra, CongViec, PhanCongCongViec, LoHang, ChiTietLo,</tspan><tspan x="58" dy="20">KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Nhập lượng kiểm tra, lượng đạt, lượng lỗi và ghi chú của từng dòng lô; xác nhận.</tspan><tspan x="58" dy="20">(ChiTietKetQuaKiemTraQCAC, ChiTietLo)</tspan></text><path d="M110 466 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="487" width="810" height="130" fill="white" stroke="#cad7ce"/><text x="58" y="511" font-size="16"><tspan x="58" dy="0">4. Kiểm tra lượng đạt cộng lượng lỗi bằng toàn bộ lượng phải kiểm của từng dòng; lưu kết quả</tspan><tspan x="58" dy="20">và cập nhật tiến độ đợt. Nguyên vật liệu lỗi được ghi nhận trả nhà cung cấp theo kết luận;</tspan><tspan x="58" dy="20">phần đạt chưa tăng tồn, phải có yêu cầu và phiếu nhập. Thành phẩm lỗi được xử lý theo kết</tspan><tspan x="58" dy="20">luận và ngoại lệ nếu cần. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC, LoHang, ChiTietLo,</tspan><tspan x="58" dy="20">LoLichKiemTra, CongViec, PhanCongLichKiemTra, ChiTietLoTraVe, DonMuaHang)</tspan></text><path d="M790 631 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="652" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="674" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="694" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="718" font-size="16"><tspan x="58" dy="0">3.1 Hủy trước khi xác nhận</tspan></text><path d="M110 758 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="779" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="803" font-size="16"><tspan x="58" dy="0">1. Bộ phận QC/AC chọn Hủy</tspan></text><path d="M110 843 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="864" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="888" font-size="16"><tspan x="58" dy="0">2. Hệ thống hủy thông tin đã nhập</tspan></text><path d="M790 928 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>