<svg xmlns="http://www.w3.org/2000/svg" width="900" height="891" viewBox="0 0 900 891"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="891" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-11 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V881 M790 110 V881" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Xuất kho</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="130" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị công việc xuất kho được giao gồm xuất nguyên vật liệu để sản xuất hoặc xuất</tspan><tspan x="58" dy="20">thành phẩm để giao hàng. (CongViec, PhanCongCongViec, PhanCongKho, PhieuYeuCauNhapXuat) Mỗi</tspan><tspan x="58" dy="20">công việc giữ đúng lô, vị trí và lượng Quản lý kho đã phân công; thứ tự điều phối ưu tiên</tspan><tspan x="58" dy="20">hạn dùng sớm, cùng hạn dùng thì nhập kho trước xuất trước. Nhân viên không tự phân công lại.</tspan><tspan x="58" dy="20">(PhanCongKho, LoHang, ChiTietLo, ViTriKho, PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M790 401 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="422" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="444" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="464" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="488" font-size="16"><tspan x="58" dy="0">2.1 Chọn Xuất nguyên vật liệu</tspan></text><path d="M110 528 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="549" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="573" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-11.01</tspan></text><path d="M790 613 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="634" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="658" font-size="16"><tspan x="58" dy="0">2.2 Chọn Xuất thành phẩm</tspan></text><path d="M110 698 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="719" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="743" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-11.02</tspan></text><path d="M790 783 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="804" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="826" font-size="16" font-weight="bold">Luồng ngoại lệ</text></svg>