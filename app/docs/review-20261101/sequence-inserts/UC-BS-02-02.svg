<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="385" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-BS-02 — Sequence · Tiếp nối 2/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V375 M790 110 V375" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">3.5 Hai người tạo đồng thời vượt tổng lượng được trả: chỉ chấp nhận lượng hợp lệ; không ghi</tspan><tspan x="58" dy="20">trùng.</tspan></text><path d="M110 214 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="235" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="259" font-size="16"><tspan x="58" dy="0">3.6 Nhân viên ngoài phân công hoặc xác nhận nhận lần hai: không cộng tồn thêm; dữ liệu đã</tspan><tspan x="58" dy="20">ghi sổ giữ nguyên.</tspan></text><path d="M110 319 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>