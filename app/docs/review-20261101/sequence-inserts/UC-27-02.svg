<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1074" viewBox="0 0 900 1074"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1074" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-27 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận mua hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1064 M790 110 V1064" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">7.1 Hủy trước khi xác nhận</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">1. Bộ phận mua hàng chọn Hủy</tspan></text><path d="M110 321 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">2. Hệ thống hủy thông tin đã nhập</tspan></text><path d="M790 406 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="250" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">3. Kết thúc use case3.1 Lập đơn mua trực tiếp1. Bộ phận mua hàng chọn Lập trực tiếp.2. Chọn</tspan><tspan x="58" dy="20">từng nguyên vật liệu, số lượng, nhà cung cấp, đơn giá, ngày nhận mong muốn, điều kiện giao</tspan><tspan x="58" dy="20">hàng và ghi chú. (MatHang, NguyenVatLieu, NhaCungCap)3. Hệ thống kiểm tra dữ liệu; tiếp tục</tspan><tspan x="58" dy="20">bước 7. Không bắt buộc có kế hoạch sản xuất hoặc báo cáo nhu cầu. (KeHoachSanXuat,</tspan><tspan x="58" dy="20">ChiTietKeHoachSanXuat, DonMuaHang, ChiTietDonMuaHang)5.1 Chọn nhà cung cấp và giá1. Bộ phận</tspan><tspan x="58" dy="20">mua hàng chọn nhà cung cấp của từng dòng. (NhaCungCap)2. Hệ thống gợi ý giá nếu đã có bảng</tspan><tspan x="58" dy="20">giá phù hợp; người mua được nhập giá thỏa thuận.3. Một đơn có thể có các nhà cung cấp khác</tspan><tspan x="58" dy="20">nhau ở các dòng; quay lại bước 5. (NhaCungCap) Chứng từ còn cần xử lý được làm nổi bật và</tspan><tspan x="58" dy="20">hiển thị số lượng chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo</tspan><tspan x="58" dy="20">không kết thúc phần việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn</tspan><tspan x="58" dy="20">hợp lệ. (ThongBao, CongViec)</tspan></text><path d="M110 691 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="712" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="734" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="754" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="778" font-size="16"><tspan x="58" dy="0">2.1 Không có kế hoạch mua hàng nào đang chờ xử lý</tspan></text><path d="M110 818 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="839" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="863" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không có kế hoạch mua hàng cần xử lý / hiển thị danh sách rỗng.</tspan><tspan x="58" dy="20">(KeHoachMuaBan, ChiTietKeHoachMuaBan, DonMuaHang, ChiTietDonMuaHang)</tspan></text><path d="M790 923 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="944" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="968" font-size="16"><tspan x="58" dy="0">2. Kết thúc UC.</tspan></text><path d="M110 1008 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>