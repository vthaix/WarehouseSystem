<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1016" viewBox="0 0 900 1016"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1016" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-BS-01 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản trị viên</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1006 M790 110 V1006" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Mở Quản lý tài khoản. (NguoiDung)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách, tìm kiếm, trạng thái và vai trò. (NguoiDung, VaiTro)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn Tạo mới; nhập tên đăng nhập, họ tên, mật khẩu, vai trò, trạng thái và xưởng khi là</tspan><tspan x="58" dy="20">chủ xưởng. (NguoiDung, Xuong)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Kiểm tra dữ liệu; mật khẩu được băm, lưu tài khoản và phân quyền, thông báo thành công.</tspan><tspan x="58" dy="20">(NguoiDung, NguoiDungVaiTro, NguoiDungXuong)</tspan></text><path d="M790 531 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="552" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="574" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="594" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="618" font-size="16"><tspan x="58" dy="0">3.1 Sửa tài khoản: chọn chi tiết, sửa thông tin được phép, xác nhận; không đổi tùy ý tên</tspan><tspan x="58" dy="20">đăng nhập đã tạo. Khi đổi mật khẩu hoặc quyền, phiên cũ bị thu hồi. (NguoiDung,</tspan><tspan x="58" dy="20">PhienDangNhap)</tspan></text><path d="M110 698 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="719" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="743" font-size="16"><tspan x="58" dy="0">3.2 Khóa hoặc xóa tài khoản: chọn tài khoản khác, xác nhận; giữ lịch sử chứng từ, tài khoản</tspan><tspan x="58" dy="20">bị khóa/xóa không đăng nhập được. (NguoiDung, NhatKyHeThong)</tspan></text><path d="M110 803 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="824" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="848" font-size="16"><tspan x="58" dy="0">3.3 Chủ xưởng: chọn đúng một trong ba xưởng ahtor, edxn, trnvnth. Vai trò khác không gắn</tspan><tspan x="58" dy="20">xưởng. (NguoiDungXuong, Xuong)</tspan></text><path d="M110 908 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="929" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="951" font-size="16" font-weight="bold">Luồng ngoại lệ</text></svg>