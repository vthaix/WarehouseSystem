<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1086" viewBox="0 0 900 1086"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1086" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-12.2 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1076 M790 110 V1076" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Mở kết quả kiểm tra đã ghi trong phạm vi được giao. (KetQuaKiemTraQCAC)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị kết quả chỉ đọc; không có nút sửa trực tiếp hoặc Chứng từ bù QC trên giao diện</tspan><tspan x="58" dy="20">hiện hành. (ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nếu thử gửi yêu cầu sửa trực tiếp theo đường dẫn cũ.</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Hệ thống từ chối sửa đè, giữ nguyên kết quả và tồn kho. (KetQuaKiemTraQCAC, TonKho)</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="532" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="554" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="574" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="598" font-size="16"><tspan x="58" dy="0">3.1 Đóng phần xem kết quả</tspan></text><path d="M110 638 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="659" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="683" font-size="16"><tspan x="58" dy="0">1. Người dùng đóng phần xem.</tspan></text><path d="M110 723 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="744" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="768" font-size="16"><tspan x="58" dy="0">2. Không có dữ liệu chỉnh sửa được lưu.</tspan></text><path d="M110 808 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="829" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="853" font-size="16"><tspan x="58" dy="0">3. Kết thúc use case</tspan></text><path d="M110 893 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="914" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="936" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="956" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="980" font-size="16"><tspan x="58" dy="0">3.1 Thử sửa qua đường dẫn cũ</tspan></text><path d="M110 1020 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>