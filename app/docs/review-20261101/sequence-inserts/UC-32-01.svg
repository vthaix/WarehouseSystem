<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1059" viewBox="0 0 900 1059"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1059" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-32 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1049 M790 110 V1049" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Phê duyệt kế hoạch mua/bán (KeHoachMuaBan, ChiTietKeHoachMuaBan)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị danh sách kế hoạch đang chờ phê duyệt (KeHoachMuaBan)</tspan></text><path d="M790 321 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="342" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="366" font-size="16"><tspan x="58" dy="0">3. Chọn một kế hoạch để xem chi tiết (KeHoachMuaBan)</tspan></text><path d="M110 406 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="427" width="810" height="150" fill="white" stroke="#cad7ce"/><text x="58" y="451" font-size="16"><tspan x="58" dy="0">4. Hiển thị kế hoạch, các dòng, ngày nhận hoặc ngày bán và nguồn nếu có. Kế hoạch mua trực</tspan><tspan x="58" dy="20">tiếp không bắt buộc có báo cáo; kế hoạch mua theo báo cáo lấy nhu cầu nguyên vật liệu; kế</tspan><tspan x="58" dy="20">hoạch bán đối chiếu báo cáo thành phẩm và lượng đạt chất lượng còn có thể sử dụng.</tspan><tspan x="58" dy="20">(KeHoachMuaBan, ChiTietKeHoachMuaBan, BanBaoCaoSanXuat, ChiTietBaoCaoSanXuat, MatHang,</tspan><tspan x="58" dy="20">NguyenVatLieu, ThanhPham, TonKho, LoHang, ChiTietLo, KetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 591 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="612" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="636" font-size="16"><tspan x="58" dy="0">5. Chọn Phê duyệt (KeHoachMuaBan)</tspan></text><path d="M110 676 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="697" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="721" font-size="16"><tspan x="58" dy="0">6. Cập nhật kế hoạch thành Đã duyệt: MUA cho phép lập đơn mua; BAN cho phép triển khai xuất</tspan><tspan x="58" dy="20">bán. Việc nhập kho chỉ thực hiện sau nhận hàng và QC đạt. (KeHoachMuaBan, ThongBao)</tspan></text><path d="M790 781 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="802" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="824" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="844" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="868" font-size="16"><tspan x="58" dy="0">5.1 Từ chối kế hoạch và có nhập lý do</tspan></text><path d="M110 908 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="929" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="953" font-size="16"><tspan x="58" dy="0">1. Ban giám đốc chọn Từ chối và nhập lý do</tspan></text><path d="M110 993 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>