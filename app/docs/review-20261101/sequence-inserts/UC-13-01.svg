<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1074" viewBox="0 0 900 1074"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1074" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-13 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Ban giám đốc</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1064 M790 110 V1064" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Lập đợt kiểm kê. (DotKiemKe, CongViec, LoLichKiemTra)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị tên đợt, mô tả, nguồn cần kiểm, thời gian, nhân viên QC/AC, Ban kiểm kê và người</tspan><tspan x="58" dy="20">lập biên bản chung. Đối với nguyên vật liệu chọn kế hoạch mua đã có đơn mua; không cần lô đã</tspan><tspan x="58" dy="20">tạo trước QC. Đối với thành phẩm chọn lô sản xuất và từng phần từ báo cáo thành phẩm.</tspan><tspan x="58" dy="20">(DotKiemKe, CongViec, KeHoachMuaBan, DonMuaHang, BanBaoCaoSanXuat, LoHang, ChiTietLo)</tspan></text><path d="M790 381 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="402" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="426" font-size="16"><tspan x="58" dy="0">3. Chọn kế hoạch mua nguyên vật liệu hoặc lô và phần thành phẩm; nhập thời gian, mô tả; chọn</tspan><tspan x="58" dy="20">từng người của QC/AC, Ban kiểm kê hoặc cả hai nhóm, và chọn một người trong danh sách được</tspan><tspan x="58" dy="20">giao lập biên bản chung. (KeHoachMuaBan, ChiTietKeHoachMuaBan, LoHang, ChiTietLo, NguoiDung,</tspan><tspan x="58" dy="20">NguoiDungVaiTro, PhanCongLichKiemTra)</tspan></text><path d="M110 526 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="547" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="571" font-size="16"><tspan x="58" dy="0">4. Hiển thị nhân viên theo hai nhóm QC/AC và Ban kiểm kê; cho phép chọn nhiều người của một</tspan><tspan x="58" dy="20">nhóm hoặc cả hai nhóm. Kiểm tra lô, phần lô, ngày nhận và phân công. (NguoiDung,</tspan><tspan x="58" dy="20">NguoiDungVaiTro, VaiTro, LoHang, ChiTietLo, LoLichKiemTra, PhanCongLichKiemTra,</tspan><tspan x="58" dy="20">PhanCongCongViec)</tspan></text><path d="M790 671 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="692" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="716" font-size="16"><tspan x="58" dy="0">5. Xác nhận lập đợt kiểm kê.</tspan></text><path d="M110 756 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="777" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="801" font-size="16"><tspan x="58" dy="0">6. Lưu đợt kiểm kê; thông báo đến từng người được giao; thông báo tạo thành công. Người</tspan><tspan x="58" dy="20">thuộc QC/AC kiểm chất lượng, người thuộc Ban kiểm kê kiểm số lượng. (DotKiemKe, CongViec,</tspan><tspan x="58" dy="20">PhanCongCongViec, LoLichKiemTra, PhanCongLichKiemTra, ThongBao)</tspan></text><path d="M790 881 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="902" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="924" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="944" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="968" font-size="16"><tspan x="58" dy="0">5.1 Ban giám đốc chọn nhập lại</tspan></text><path d="M110 1008 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>