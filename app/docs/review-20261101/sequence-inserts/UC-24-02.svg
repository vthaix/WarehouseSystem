<svg xmlns="http://www.w3.org/2000/svg" width="900" height="997" viewBox="0 0 900 997"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="997" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-24 — Sequence · Tiếp nối 2/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Chủ xưởng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V987 M790 110 V987" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-24.1</tspan></text><path d="M790 194 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">4.2 Chọn Xóa</tspan></text><path d="M110 279 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">1. Hệ thống thực hiện UC-24.2 Chứng từ còn cần xử lý được làm nổi bật và hiển thị số lượng</tspan><tspan x="58" dy="20">chờ trên chức năng của đúng người phụ trách. Mở xem hoặc đọc thông báo không kết thúc phần</tspan><tspan x="58" dy="20">việc; dấu chỉ hết khi hoàn thành thao tác nghiệp vụ hoặc nguồn không còn hợp lệ. (ThongBao,</tspan><tspan x="58" dy="20">CongViec)</tspan></text><path d="M790 424 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="445" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="467" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="487" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="511" font-size="16"><tspan x="58" dy="0">1.1 Tìm kiếm hoặc lọc không có kết quả phù hợp</tspan></text><path d="M110 551 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="572" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="596" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không tìm thấy yêu cầu phù hợp. (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 656 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="677" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="701" font-size="16"><tspan x="58" dy="0">2. Quay lại bước 1</tspan></text><path d="M110 741 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="762" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="786" font-size="16"><tspan x="58" dy="0">2.1 Không có yêu cầu trong hệ thống</tspan></text><path d="M110 826 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="847" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="871" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo không tìm thấy yêu cầu (PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat)</tspan></text><path d="M790 931 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>