<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="620" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-12.2 — Sequence · Tiếp nối 2/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V610 M790 110 V610" stroke="#168049" stroke-dasharray="6 4"/><rect x="45" y="130" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="154" font-size="16"><tspan x="58" dy="0">1. Hệ thống thông báo kết quả đã ghi không được sửa đè. (KetQuaKiemTraQCAC)</tspan></text><path d="M790 194 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="215" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="239" font-size="16"><tspan x="58" dy="0">2. Kết thúc thao tác, giữ dữ liệu gốc.</tspan></text><path d="M110 279 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="300" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="324" font-size="16"><tspan x="58" dy="0">3.2 Người dùng ngoài quyền hoặc hết phiên</tspan></text><path d="M110 364 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="385" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="409" font-size="16"><tspan x="58" dy="0">1. Từ chối thao tác hoặc yêu cầu đăng nhập lại; không lộ dữ liệu trái quyền.</tspan></text><path d="M110 449 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="470" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="494" font-size="16"><tspan x="58" dy="0">2. Giữ nguyên kết quả, phiếu kho và tồn kho. Nút Chứng từ bù QC đã bỏ khỏi giao diện, không</tspan><tspan x="58" dy="20">mô tả là bước sử dụng bình thường.</tspan></text><path d="M110 554 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>