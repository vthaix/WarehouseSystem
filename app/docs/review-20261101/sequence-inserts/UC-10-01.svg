<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1074" viewBox="0 0 900 1074"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1074" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-10 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Nhân viên kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1064 M790 110 V1064" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn chức năng Nhập kho</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị công việc nhập kho được giao, yêu cầu nguồn, lô hoặc phần lô và lượng còn được</tspan><tspan x="58" dy="20">thực hiện. (CongViec, PhanCongCongViec, PhanCongKho, PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, LoHang, ChiTietLo)</tspan></text><path d="M790 361 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="382" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="406" font-size="16"><tspan x="58" dy="0">3. Chọn công việc, đối chiếu giấy tờ thực nhập với đúng lô và vị trí Quản lý kho đã giao;</tspan><tspan x="58" dy="20">kiểm tra số lượng gợi ý, nhập lượng thực nhập và ghi chú. Không tự đổi sang lô hoặc vị trí</tspan><tspan x="58" dy="20">ngoài phân công. (CongViec, PhanCongCongViec, PhanCongKho, LoHang, ChiTietLo, ViTriKho)</tspan></text><path d="M110 486 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="507" width="810" height="110" fill="white" stroke="#cad7ce"/><text x="58" y="531" font-size="16"><tspan x="58" dy="0">4. Kiểm tra đúng người được phân công, kho, vị trí, dòng lô và lượng nhập không vượt lượng</tspan><tspan x="58" dy="20">được giao hoặc phần đạt chất lượng còn chưa nhập. (CongViec, PhanCongCongViec, PhanCongKho,</tspan><tspan x="58" dy="20">Kho, ViTriKho, LoHang, ChiTietLo, KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietPhieuKho)</tspan></text><path d="M790 631 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="652" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="676" font-size="16"><tspan x="58" dy="0">5. Xác nhận nhập kho</tspan></text><path d="M110 716 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="737" width="810" height="130" fill="white" stroke="#cad7ce"/><text x="58" y="761" font-size="16"><tspan x="58" dy="0">6. Ghi phiếu nhập kho, tăng tồn theo lượng thực nhập, cập nhật lượng đã thực hiện và trạng</tspan><tspan x="58" dy="20">thái công việc; thông báo thành công. Hồ sơ được cung cấp cho người có quyền xem. (PhieuKho,</tspan><tspan x="58" dy="20">ChiTietPhieuKho, TonKho, BienDongKho, PhanCongKho, PhieuYeuCauNhapXuat,</tspan><tspan x="58" dy="20">ChiTietPhieuYeuCauNhapXuat, CongViec) Thời điểm ghi phiếu nhập là căn cứ xét lô nhập trước</tspan><tspan x="58" dy="20">khi các lô có cùng hạn dùng tại kho này. (PhieuKho, ChiTietPhieuKho, Kho)</tspan></text><path d="M790 881 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="902" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="924" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="944" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="968" font-size="16"><tspan x="58" dy="0">3.1 Chỉ nhập một phần số lượng được phân công</tspan></text><path d="M110 1008 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>