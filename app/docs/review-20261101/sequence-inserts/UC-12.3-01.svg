<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1061" viewBox="0 0 900 1061"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1061" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-12.3 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Bộ phận QC/AC</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1051 M790 110 V1051" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Mở chi tiết kết quả kiểm tra. (KetQuaKiemTraQCAC)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hệ thống hiển thị kết quả đã ghi và không cung cấp thao tác xóa kết quả như một bước thực</tspan><tspan x="58" dy="20">hiện thành công. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Người dùng đóng phần xem; không có thao tác xóa trực tiếp để xác nhận thành công.</tspan></text><path d="M790 426 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Kết thúc UC; giữ nguyên kết quả và lịch sử.</tspan></text><path d="M790 511 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="532" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="554" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="574" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="598" font-size="16"><tspan x="58" dy="0">2.1 Cần sửa sai kết quả</tspan></text><path d="M110 638 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="659" width="810" height="90" fill="white" stroke="#cad7ce"/><text x="58" y="683" font-size="16"><tspan x="58" dy="0">1. Không xóa hoặc sửa đè kết quả đã ghi; người dùng báo người phụ trách để đối chiếu chứng</tspan><tspan x="58" dy="20">từ. Không có nút Chứng từ bù QC trong giao diện hiện hành. (KetQuaKiemTraQCAC,</tspan><tspan x="58" dy="20">ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 763 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="784" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="808" font-size="16"><tspan x="58" dy="0">2. Nếu kết quả đã gắn với hàng nhập kho hoặc chứng từ khác, phải xử lý theo luồng điều chỉnh</tspan><tspan x="58" dy="20">có liên quan; không xóa lịch sử. (KetQuaKiemTraQCAC, ChiTietKetQuaKiemTraQCAC)</tspan></text><path d="M110 868 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="889" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="911" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="931" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="955" font-size="16"><tspan x="58" dy="0">2.2 Yêu cầu xóa kết quả đã ghi</tspan></text><path d="M110 995 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>