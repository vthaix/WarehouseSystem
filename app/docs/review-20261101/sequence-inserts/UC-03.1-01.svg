<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1064" viewBox="0 0 900 1064"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1064" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-03.1 — Sequence · Tiếp nối 1/3</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Khách hàng</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1054 M790 110 V1054" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Chọn Sửa đơn hàng (DonHang)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị form với thông tin hiện tại của đơn hàng (DonHang, ChiTietDonHang, MatHang,</tspan><tspan x="58" dy="20">ThanhPham)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nhập thông tin muốn chỉnh sửa (số lượng, mô tả) (DonHang, ChiTietDonHang)</tspan></text><path d="M110 426 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="447" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="471" font-size="16"><tspan x="58" dy="0">4. Chọn xác nhận (DonHang, ChiTietDonHang)</tspan></text><path d="M110 511 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="532" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="556" font-size="16"><tspan x="58" dy="0">5. Kiểm tra thông tin mới (DonHang, ChiTietDonHang, KeHoachSanXuat, ChiTietKeHoachSanXuat)</tspan></text><path d="M790 596 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="617" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="641" font-size="16"><tspan x="58" dy="0">6. Cập nhật thông tin đơn hàng hợp lệ, giữ trạng thái xử lý hiện tại. (DonHang,</tspan><tspan x="58" dy="20">ChiTietDonHang)</tspan></text><path d="M790 701 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="722" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="746" font-size="16"><tspan x="58" dy="0">7. Thông báo cập nhật đơn hàng thành công.</tspan></text><path d="M790 786 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="807" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="829" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="849" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="873" font-size="16"><tspan x="58" dy="0">2.1 Khách hàng chọn Quay lại</tspan></text><path d="M110 913 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="934" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="958" font-size="16"><tspan x="58" dy="0">1. Đi đến bước 4 của UC-03 (hủy thao tác sửa)</tspan></text><path d="M110 998 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>