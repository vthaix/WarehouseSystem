<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1101" viewBox="0 0 900 1101"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#168049"/></marker></defs><rect width="900" height="1101" fill="white"/><text x="450" y="25" text-anchor="middle" font-size="17" font-weight="bold">UC-BS-02 — Sequence · Tiếp nối 1/2</text><rect x="10" y="48" width="400" height="60" fill="white" stroke="#168049"/><text x="210" y="83" text-anchor="middle" font-size="16">Quản lý kho</text><rect x="640" y="48" width="240" height="60" fill="white" stroke="#168049"/><text x="760" y="83" text-anchor="middle" font-size="16">Hệ thống</text><path d="M110 110 V1091 M790 110 V1091" stroke="#168049" stroke-dasharray="6 4"/><rect x="30" y="130" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="152" font-size="16" font-weight="bold">Luồng cơ bản</text><rect x="45" y="172" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="196" font-size="16"><tspan x="58" dy="0">1. Mở Hàng khách trả, chọn phiếu giao và dòng thành phẩm gốc. (PhieuKho, ChiTietPhieuKho)</tspan></text><path d="M110 236 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="257" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="281" font-size="16"><tspan x="58" dy="0">2. Hiển thị đơn/khách gốc, lượng đã giao, đã trả và còn được trả. (DonHang, KhachHang,</tspan><tspan x="58" dy="20">ChiTietLoTraVe)</tspan></text><path d="M790 341 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="362" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="386" font-size="16"><tspan x="58" dy="0">3. Nhập lượng trả, lý do, kho hàng trả về; xác nhận và phân công nhận hàng. (LoHang, Kho,</tspan><tspan x="58" dy="20">CongViec)</tspan></text><path d="M110 446 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="467" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="491" font-size="16"><tspan x="58" dy="0">4. Lưu yêu cầu và thông báo nhân viên được giao; chưa tăng tồn cho tới khi ghi nhận nhận</tspan><tspan x="58" dy="20">hàng. (ThongBao, PhieuKho)</tspan></text><path d="M790 551 H110" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="572" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="594" font-size="16" font-weight="bold">Luồng thay thế</text><rect x="45" y="614" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="638" font-size="16"><tspan x="58" dy="0">3.1 Nhân viên được giao xác nhận phần thực nhận: lưu đúng lượng đã nhận trong kho hàng trả</tspan><tspan x="58" dy="20">về, trạng thái cách ly; chưa được dùng để sản xuất hoặc bán. (ChiTietLoTraVe, TonKho)</tspan></text><path d="M110 698 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="719" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="743" font-size="16"><tspan x="58" dy="0">3.2 QC kiểm tra hàng trả theo công việc; hàng vẫn phải theo quyết định xử lý và chứng từ</tspan><tspan x="58" dy="20">đúng quyền trước khi thay đổi nhóm chất lượng. (KetQuaKiemTraQCAC, BanDeXuatXuLyNgoaiLe)</tspan></text><path d="M110 803 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="45" y="824" width="810" height="70" fill="white" stroke="#cad7ce"/><text x="58" y="848" font-size="16"><tspan x="58" dy="0">3.3 Hủy khi còn được phép: giải phóng phần chưa thực hiện, không xóa chứng từ nhận đã ghi</tspan><tspan x="58" dy="20">sổ.</tspan></text><path d="M110 908 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="929" width="840" height="32" fill="#f0f8f2" stroke="#168049"/><text x="44" y="951" font-size="16" font-weight="bold">Luồng ngoại lệ</text><rect x="45" y="971" width="810" height="50" fill="white" stroke="#cad7ce"/><text x="58" y="995" font-size="16"><tspan x="58" dy="0">3.4 Trả vượt lượng giao còn lại, sai dòng giao, lượng không dương hoặc sai kho: không lưu.</tspan></text><path d="M110 1035 H790" stroke="#168049" stroke-width="1.5" marker-end="url(#a)"/></svg>