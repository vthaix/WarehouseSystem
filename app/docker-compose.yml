name: warehouse-mono
x-app: &app
  image: warehouse-monolith:${APP_IMAGE_TAG:-local}
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
x-env: &env
  NODE_ENV: ${NODE_ENV:-development}
  HOST: 0.0.0.0
  PORT: "3000"
  STORAGE_DRIVER: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: warehouse_db
  DB_USER: warehouse
  DB_PASSWORD: warehouse123
  SESSION_SECRET_FILE: /run/warehouse-app-secrets/session_secret
  DEMO_PASSWORD: "123456"
  AUTO_MIGRATE: "false"
  SEED_DEMO: "false"
  ENABLE_TEST_RESET: ${ENABLE_TEST_RESET:-true}
services:
  setup:
    <<: *app
    command: ["node", "scripts/setup-secrets.cjs"]
    environment:
      DB_PASSWORD: warehouse123
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warehouse_root123}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEMO_PASSWORD: "123456"
    volumes:
      - mono_secrets:/var/lib/warehouse-app-secrets
      - mono_mysql_secrets:/var/lib/warehouse-mysql-secrets
    network_mode: none
    restart: "no"
  mysql:
    image: mysql:8.4
    pull_policy: missing
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: warehouse_db
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: warehouse123
      MYSQL_ROOT_PASSWORD_FILE: /run/warehouse-mysql-secrets/root_password
    volumes:
      - mono_mysql_data:/var/lib/mysql
      - mono_mysql_secrets:/run/warehouse-mysql-secrets:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=warehouse123 mysql --protocol=TCP -h 127.0.0.1 -uwarehouse -Dwarehouse_db -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["node", "scripts/database.cjs", "migrate"]
    environment: *env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mono_secrets:/run/warehouse-app-secrets:ro
    restart: "no"
  seed:
    <<: *app
    command: ["node", "scripts/database.cjs", "seed"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - mono_secrets:/run/warehouse-app-secrets:ro
    restart: "no"
  app:
    <<: *app
    init: true
    environment: *env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - mono_secrets:/run/warehouse-app-secrets:ro
      - mono_images:/app/src/images
      - mono_backups:/var/backups/warehouse
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  adminer:
    image: adminer:4
    pull_policy: missing
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mono_mysql_data:
  mono_secrets:
  mono_mysql_secrets:
  mono_backups:
  mono_images:
